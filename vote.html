<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>오늘의 투표 | Birdie</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./app.js"></script>
<script type="text/babel">

function App() {
  const { myId } = useIdentity();
  const { roster } = useRoster();
  const [schedule, setSchedule] = React.useState([]);
  const [checkinlog, setCheckinlog] = React.useState([]);
  const [dailyvotesDoc, setDailyvotesDoc] = React.useState({});
  const today = todayStr();

  React.useEffect(() => {
    const unsub = REFS.schedule.onSnapshot((snap) => {
      const data = snap.data();
      setSchedule(data && data.items ? data.items : []);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.checkinlog.onSnapshot((snap) => {
      const data = snap.data();
      setCheckinlog(data && data.items ? data.items : []);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.dailyvotes.onSnapshot((snap) => {
      const data = snap.data();
      setDailyvotesDoc(data && data.data ? data.data : {});
    }, () => {});
    return () => unsub();
  }, []);

  // 투표는 "오늘 진짜 있었던 모임"에만 해당돼요. 일정에서 참석 체크한 사람 + 관리자가 매칭 페이지에서
  // 직접 체크인시킨 사람까지 합쳐서 판단해요 (체크인 경로가 두 가지라서 하나만 보면 놓칠 수 있어요).
  const attendingToday = combinedTodayAttendees(schedule, checkinlog, roster);
  const iAttendedToday = !!(myId && attendingToday.some((m) => m.id === myId));
  const candidates = attendingToday.filter((m) => m.id !== myId);

  // 이달의 신인상은 "최근 가입한 회원"만 후보로 나와요 (가입 30일 이내, 또는 이번 달 가입)
  const thisMonth = today.slice(0, 7);
  const newcomerCandidates = candidates.filter((m) => {
    const full = roster.find((r) => r.id === m.id);
    if (!full || !full.joinedAt) return false;
    if (full.joinedAt.slice(0, 7) === thisMonth) return true;
    const days = Math.floor((new Date() - new Date(full.joinedAt)) / 86400000);
    return days <= 30;
  });

  const myVotesToday = dailyvotesDoc[today] || {};

  function hasVoted(category) {
    const votes = myVotesToday[category] || [];
    return votes.some((v) => v.voterId === myId);
  }

  function castVote(category, votedForId) {
    if (!myId || !iAttendedToday) return;
    if (hasVoted(category)) return;
    // 트랜잭션으로 처리 — 경기 끝나고 여러 명이 한꺼번에 투표해도, 서로 덮어써서 표가 사라지지 않게 해요.
    db.runTransaction(async (tx) => {
      const snap = await tx.get(REFS.dailyvotes);
      const data = snap.data() || {};
      const allVotes = data.data || {};
      const dayVotes = { ...(allVotes[today] || {}) };
      const catVotes = dayVotes[category] || [];
      if (catVotes.some((v) => v.voterId === myId)) return; // 이미 투표했으면 중복 방지
      dayVotes[category] = [...catVotes, { voterId: myId, votedForId: votedForId || null }];
      const next = { ...allVotes, [today]: dayVotes };
      tx.set(REFS.dailyvotes, { data: next });
    }).catch(() => {});
  }

  function renderCategory(cat, candidateList) {
    const voted = hasVoted(cat.key);
    return (
      <div key={cat.key} className="bg-white rounded-2xl p-4 border border-stone-200">
        <p className="text-sm font-bold text-stone-800 mb-1">{cat.emoji} {cat.label}</p>
        <p className="text-xs text-stone-400 mb-3">{cat.question}</p>
        {voted ? (
          <p className="text-xs font-semibold text-center py-2" style={{ color: "#4CAF50" }}>✅ 투표 완료! 다음 모임 때 또 투표할 수 있어요.</p>
        ) : candidateList.length === 0 ? (
          <p className="text-xs text-stone-400 text-center py-2">투표할 후보가 없어요.</p>
        ) : (
          <div className="flex flex-wrap gap-2">
            {candidateList.map((c) => (
              <button
                key={c.id}
                onClick={() => castVote(cat.key, c.id)}
                className="px-3 py-1.5 rounded-full text-xs border border-stone-200 bg-stone-50 text-stone-600 tap-scale"
              >
                {c.name}
              </button>
            ))}
            <button
              onClick={() => castVote(cat.key, null)}
              className="px-3 py-1.5 rounded-full text-xs border border-dashed border-stone-300 bg-white text-stone-400 tap-scale"
            >
              없음
            </button>
          </div>
        )}
      </div>
    );
  }

  return (
    <RequireLogin myId={myId}>
    <div className="min-h-screen bg-white text-stone-800 font-sans pb-24">
      <TopHeader title="🗳️ 모임 투표" subtitle="이번 모임 함께한 사람들에게 투표해요" />

      {!iAttendedToday ? (
        <section className="px-5 max-w-2xl mx-auto">
          <p className="text-sm text-stone-400 bg-white rounded-2xl p-6 text-center border border-dashed border-stone-200">
            오늘 모임에 참석 체크를 한 사람만 투표할 수 있어요. 아직 열리지 않은 다음 모임엔 투표할 수 없어요.<br />
            더보기 → 일정에서 먼저 오늘 날짜 모임에 참석 체크해주세요.
          </p>
        </section>
      ) : (
        <section className="px-5 max-w-2xl mx-auto space-y-4 mb-8">
          <div className="rounded-2xl p-3 text-center text-xs text-stone-500" style={{ backgroundColor: "#F0FBF1", border: "1px solid #4CAF50" }}>
            🔒 완전 익명이에요. 본인에게는 투표할 수 없고, 카테고리별로 1표씩만 가능해요. 투표 결과는 그 자리에서 공개되지 않고, 매월 1일에 한 달치를 모아서 발표돼요. 투표할 사람이 없으면 "없음"을 눌러도 돼요.
          </div>
          {window.VOTE_CATEGORIES.map((cat) => renderCategory(cat, candidates))}
          {renderCategory(window.NEWCOMER_CATEGORY, newcomerCandidates)}
        </section>
      )}

      <BottomNav active="more" />
    </div>
    </RequireLogin>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
