<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>오늘의 투표 | Birdie</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./app.js"></script>
<script type="text/babel">

function App() {
  const { myId } = useIdentity();
  const { roster } = useRoster();
  const [rsvp, setRsvp] = React.useState({});
  const [dailyvotesDoc, setDailyvotesDoc] = React.useState({});
  const today = todayStr();

  React.useEffect(() => {
    const unsub = REFS.checkin.onSnapshot((snap) => {
      const data = snap.data();
      setRsvp(data && data.data ? data.data : {});
    });
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.dailyvotes.onSnapshot((snap) => {
      const data = snap.data();
      setDailyvotesDoc(data && data.data ? data.data : {});
    }, () => {});
    return () => unsub();
  }, []);

  const attendingToday = roster.filter((m) => rsvp[m.id] === "in");
  const iAttendedToday = !!(myId && rsvp[myId] === "in");
  const candidates = attendingToday.filter((m) => m.id !== myId);
  const myVotesToday = ((dailyvotesDoc[today] || {}));

  function hasVoted(category) {
    const votes = (myVotesToday[category] || []);
    return votes.some((v) => v.voterId === myId);
  }

  function castVote(category, votedForId) {
    if (!myId || !iAttendedToday) return;
    if (hasVoted(category)) return;
    const dayVotes = { ...(dailyvotesDoc[today] || {}) };
    const catVotes = [...(dayVotes[category] || []), { voterId: myId, votedForId }];
    dayVotes[category] = catVotes;
    const next = { ...dailyvotesDoc, [today]: dayVotes };
    setDailyvotesDoc(next);
    REFS.dailyvotes.set({ data: next }).catch(() => {});
  }

  return (
    <RequireLogin myId={myId}>
    <div className="min-h-screen bg-white text-stone-800 font-sans pb-24">
      <TopHeader title="🗳️ 오늘의 투표" subtitle="오늘 함께 운동한 사람들에게 투표해요" />

      {!iAttendedToday ? (
        <section className="px-5 max-w-2xl mx-auto">
          <p className="text-sm text-stone-400 bg-white rounded-2xl p-6 text-center border border-dashed border-stone-200">
            오늘 참석 체크를 한 사람만 투표할 수 있어요.<br />
            홈 화면에서 먼저 참석 체크해주세요.
          </p>
        </section>
      ) : candidates.length === 0 ? (
        <section className="px-5 max-w-2xl mx-auto">
          <p className="text-sm text-stone-400 bg-white rounded-2xl p-6 text-center border border-dashed border-stone-200">
            투표할 다른 참석자가 아직 없어요.
          </p>
        </section>
      ) : (
        <section className="px-5 max-w-2xl mx-auto space-y-4 mb-8">
          <div className="rounded-2xl p-3 text-center text-xs text-stone-500" style={{ backgroundColor: "#F0FBF1", border: "1px solid #4CAF50" }}>
            🔒 완전 익명이에요. 본인에게는 투표할 수 없고, 카테고리별로 1표씩만 가능해요.
          </div>
          {window.VOTE_CATEGORIES.map((cat) => {
            const voted = hasVoted(cat.key);
            return (
              <div key={cat.key} className="bg-white rounded-2xl p-4 border border-stone-200">
                <p className="text-sm font-bold text-stone-800 mb-1">{cat.emoji} {cat.label}</p>
                <p className="text-xs text-stone-400 mb-3">{cat.question}</p>
                {voted ? (
                  <p className="text-xs font-semibold text-center py-2" style={{ color: "#4CAF50" }}>✅ 투표 완료! 내일 또 투표할 수 있어요.</p>
                ) : (
                  <div className="flex flex-wrap gap-2">
                    {candidates.map((c) => (
                      <button
                        key={c.id}
                        onClick={() => castVote(cat.key, c.id)}
                        className="px-3 py-1.5 rounded-full text-xs border border-stone-200 bg-stone-50 text-stone-600 tap-scale"
                      >
                        {c.name}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </section>
      )}

      <BottomNav active="more" />
    </div>
    </RequireLogin>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
