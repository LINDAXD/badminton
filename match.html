// ---------- helpers ----------
const pKey = (a, b) => [a, b].sort().join("|");

function buildHistory() {
  return { partner: {}, opponent: {} };
}
function bump(map, key) {
  map[key] = (map[key] || 0) + 1;
}

// score a single 4-person court split
// ctx: { hist, skillOf, mode, todayPairCount, isFirstTimer, isKindOrStrong }
function splitScore(four, ctx) {
  const { hist, skillOf, mode = "balance", todayPairCount, isFirstTimer, isKindOrStrong } = ctx || {};

  // 🎲 랜덤 모드: 아무 계산 없이 완전 무작위로 팀을 갈라요
  if (mode === "random") {
    const splits = [
      [[four[0], four[1]], [four[2], four[3]]],
      [[four[0], four[2]], [four[1], four[3]]],
      [[four[0], four[3]], [four[1], four[2]]],
    ];
    const [a, b] = splits[Math.floor(Math.random() * splits.length)];
    return { s: 0, a, b };
  }

  const splits = [
    [[four[0], four[1]], [four[2], four[3]]],
    [[four[0], four[2]], [four[1], four[3]]],
    [[four[0], four[3]], [four[1], four[2]]],
  ];
  let best = null;
  for (const [a, b] of splits) {
    // 1) 최근 파트너/상대 겹침 회피 (처음 만나는 사람 우선) — 😊친목 모드에서는 훨씬 더 강하게 반영
    const historyWeight = mode === "social" ? 3 : 1;
    const historyScore =
      (hist.partner[pKey(a[0].id, a[1].id)] || 0) * 3 * historyWeight +
      (hist.partner[pKey(b[0].id, b[1].id)] || 0) * 3 * historyWeight +
      ((hist.opponent[pKey(a[0].id, b[0].id)] || 0) +
        (hist.opponent[pKey(a[0].id, b[1].id)] || 0) +
        (hist.opponent[pKey(a[1].id, b[0].id)] || 0) +
        (hist.opponent[pKey(a[1].id, b[1].id)] || 0)) * historyWeight;

    // 2) 오늘 같이 친 횟수 제한 — 2번까지는 약한 페널티, 3번째부터는 강하게 페널티
    let todayPenalty = 0;
    if (todayPairCount) {
      const pairs = [
        [a[0].id, a[1].id], [b[0].id, b[1].id],
        [a[0].id, b[0].id], [a[0].id, b[1].id], [a[1].id, b[0].id], [a[1].id, b[1].id],
      ];
      pairs.forEach(([x, y]) => {
        const c = todayPairCount(x, y);
        todayPenalty += c >= 3 ? 500 : c * c * 6;
      });
    }

    // 3) 실력 밸런스 — 모드에 따라 가중치가 달라져요 (친목 모드는 실력 거의 신경 안 씀)
    const skillA = skillOf ? (skillOf(a[0].id) + skillOf(a[1].id)) / 2 : 0;
    const skillB = skillOf ? (skillOf(b[0].id) + skillOf(b[1].id)) / 2 : 0;
    const skillGap = Math.abs(skillA - skillB);
    const skillWeight = mode === "skill" ? 14 : mode === "social" ? 1 : 8;
    const skillScore = skillGap * skillWeight;

    // 4) 균형 모드에서는 왕초보/초보끼리만 뭉치지 않도록, 팀 내부 실력차가 "적당히" 섞이는 조합을 살짝 선호
    let mixBonus = 0;
    if (mode === "balance" && skillOf) {
      const teamAGap = Math.abs(skillOf(a[0].id) - skillOf(a[1].id));
      const teamBGap = Math.abs(skillOf(b[0].id) - skillOf(b[1].id));
      // 팀 내부가 너무 똑같은 하위권끼리만 묶이는 것 방지 (아주 약하게만 유도)
      mixBonus = -(teamAGap + teamBGap) * 1.5;
    }

    // 5) 첫 참석자는 고수/친절왕과 한 팀이 되도록 유도 (😊친목 모드는 훨씬 강하게)
    let firstTimerBonus = 0;
    if (isFirstTimer && isKindOrStrong) {
      const bonusWeight = mode === "social" ? 3 : 1;
      [[a[0], a[1]], [b[0], b[1]]].forEach(([p1, p2]) => {
        if (isFirstTimer(p1.id) && isKindOrStrong(p2.id)) firstTimerBonus -= 6 * bonusWeight;
        if (isFirstTimer(p2.id) && isKindOrStrong(p1.id)) firstTimerBonus -= 6 * bonusWeight;
      });
    }

    const s = historyScore + todayPenalty + skillScore + mixBonus + firstTimerBonus;
    if (!best || s < best.s) best = { s, a, b };
  }
  return best;
}

function generateRound(players, numCourts, hist, restIds = new Set(), skillOf = null) {
  const forcedRest = players.filter((p) => restIds.has(p.id));
  const pool = players.filter((p) => !restIds.has(p.id));

  const need = numCourts * 4;
  const sorted = [...pool].sort(
    (a, b) => a.gamesPlayed - b.gamesPlayed || Math.random() - 0.5
  );
  const playing = sorted.slice(0, need);
  const usable = playing.slice(0, Math.floor(playing.length / 4) * 4);
  const resting = [...forcedRest, ...sorted.slice(usable.length)];

  let bestAssignment = null;
  let bestTotal = Infinity;
  for (let t = 0; t < 40; t++) {
    const shuffled = [...usable].sort(() => Math.random() - 0.5);
    let total = 0;
    const courts = [];
    for (let i = 0; i < shuffled.length; i += 4) {
      const four = shuffled.slice(i, i + 4);
      const { s, a, b } = splitScore(four, { hist, skillOf, mode: "balance", todayPairCount: () => 0, isFirstTimer: () => false, isKindOrStrong: () => false });
      total += s;
      courts.push({ teamA: a, teamB: b });
    }
    if (total < bestTotal) {
      bestTotal = total;
      bestAssignment = courts;
    }
  }

  const matches = (bestAssignment || []).map((c, idx) => ({
    id: uid(),
    court: idx + 1,
    teamA: c.teamA,
    teamB: c.teamB,
    scoreA: "",
    scoreB: "",
    done: false,
  }));

  return { matches, resting };
}

// ---------- main app ----------
function ManualPicker({ waitingPlayers, selected, onToggle, onConfirm, onAutoFill, onCancel, pinnedPair, onTogglePin }) {
  const selectedPlayers = waitingPlayers.filter((p) => selected.includes(p.id));
  return (
    <div className="text-left bg-stone-50 rounded-xl p-3 space-y-2">
      <p className="text-xs font-semibold text-stone-600">직접 선택 ({selected.length}/4)</p>
      <p className="text-[11px] text-stone-400">1~3명만 지정하고 나머지는 자동으로 채울 수도 있어요.</p>
      {waitingPlayers.length === 0 ? (
        <p className="text-xs text-stone-400">대기 중인 인원이 없어요.</p>
      ) : (
        <div className="flex flex-wrap gap-2">
          {waitingPlayers.map((p) => {
            const picked = selected.includes(p.id);
            return (
              <button
                key={p.id}
                onClick={() => onToggle(p.id)}
                className={`px-2.5 py-1 rounded-full text-xs border transition ${
                  picked ? "text-white border-transparent" : "bg-white text-stone-500 border-stone-200"
                }`}
                style={picked ? { backgroundColor: "#4CAF50" } : {}}
              >
                {p.name}
              </button>
            );
          })}
        </div>
      )}
      {selected.length === 4 && (
        <div className="pt-1 border-t border-stone-200">
          <p className="text-[11px] text-stone-500 mt-2 mb-1">🔗 이 중 두 명을 같은 팀으로 고정 (선택)</p>
          <div className="flex flex-wrap gap-1.5">
            {selectedPlayers.map((p) => {
              const pinned = pinnedPair.includes(p.id);
              return (
                <button
                  key={p.id}
                  onClick={() => onTogglePin(p.id)}
                  className={`px-2.5 py-1 rounded-full text-[11px] border transition ${
                    pinned ? "text-white border-transparent" : "bg-white text-stone-400 border-stone-200"
                  }`}
                  style={pinned ? { backgroundColor: "#FFD54F", color: "#5c4a00" } : {}}
                >
                  {pinned ? "🔗 " : ""}{p.name}
                </button>
              );
            })}
          </div>
        </div>
      )}
      <div className="flex gap-2 pt-1">
        {selected.length > 0 && selected.length < 4 ? (
          <button
            onClick={onAutoFill}
            className="flex-1 rounded-lg py-2 text-xs font-semibold text-white"
            style={{ backgroundColor: "#4CAF50" }}
          >
            나머지 {4 - selected.length}명 자동으로 채우고 시작
          </button>
        ) : (
          <button
            disabled={selected.length !== 4}
            onClick={onConfirm}
            className="flex-1 rounded-lg py-2 text-xs font-semibold text-white disabled:bg-stone-300 disabled:text-stone-500"
            style={selected.length === 4 ? { backgroundColor: "#4CAF50" } : {}}
          >
            이 4명으로 시작
          </button>
        )}
        <button onClick={onCancel} className="flex-1 rounded-lg py-2 text-xs font-semibold border border-stone-200 text-stone-500">
          취소
        </button>
      </div>
    </div>
  );
}

const MATCH_MODES = [
  { key: "random", label: "🎲 랜덤", desc: "완전 무작위로 팀을 짜요." },
  { key: "social", label: "😊 친목", desc: "같이 많이 안 쳐본 사람 위주로, 첫 참석자를 배려해서 짜요." },
  { key: "balance", label: "⚖️ 균형 (추천)", desc: "실력, 오늘 같이 친 횟수, 첫 참석 여부까지 자동으로 종합해서 가장 공평하게 짜요. 운영자는 신경 안 써도 돼요." },
  { key: "skill", label: "🏆 실력", desc: "비슷한 실력끼리 묶어서 진짜 승부가 되는 경기를 만들어요." },
];

// 🏸 운영 추천 — 대기시간/첫참석/반복매칭 같은, 이미 계산되고 있는 신호들을 사람이 읽는 문장으로 보여줘요.
// "누구 쉬었지? 누구랑 붙이지?" 같은 운영자의 고민을 대신 알려주는 패널이에요.
function OpsRecommendation({ waitingPlayers, players, matchhistory, matchMode, isFirstTimer, roster }) {
  if (players.length === 0) return null;
  const tips = [];

  // 1) 제일 오래 기다린 사람
  if (waitingPlayers.length > 0) {
    const longest = waitingPlayers[0];
    tips.push(`${longest.name}님이 대기열 맨 앞이에요. 다음 코트에 우선 배정돼요.`);
  }

  // 2) 오늘 첫 참석자
  const firstTimersToday = players.filter((p) => isFirstTimer(p.id));
  if (firstTimersToday.length > 0) {
    tips.push(`${firstTimersToday.map((p) => p.name).join(", ")}님은 오늘 첫 참석이에요. 친절하게 챙겨주세요 🌱`);
  }

  // 3) 오늘 이미 여러 번 같이 친 조합
  const today = todayStr();
  const todayCounts = {};
  matchhistory.forEach((m) => {
    if (m.date !== today) return;
    const all = [...(m.teamA || []), ...(m.teamB || [])];
    for (let i = 0; i < all.length; i++) {
      for (let j = i + 1; j < all.length; j++) {
        const k = pKey(all[i].id, all[j].id);
        todayCounts[k] = (todayCounts[k] || 0) + 1;
      }
    }
  });
  Object.keys(todayCounts).forEach((k) => {
    if (todayCounts[k] < 3) return;
    const [id1, id2] = k.split("|");
    const p1 = players.find((p) => p.id === id1);
    const p2 = players.find((p) => p.id === id2);
    if (p1 && p2) tips.push(`${p1.name}님과 ${p2.name}님은 오늘 벌써 ${todayCounts[k]}번 같이 쳤어요. 다른 조합을 추천해요.`);
  });

  // 4) 오늘 모드 추천 (레벨 분포를 보고 판단)
  if (matchMode !== "social") {
    const beginnerCount = players.filter((p) => {
      const m = (roster || []).find((r) => r.id === p.id);
      return m && ["왕초보", "초보"].includes(m.level);
    }).length;
    if (players.length > 0 && beginnerCount / players.length >= 0.6) {
      tips.push("오늘은 왕초보/초보 비중이 높아요. 😊 친목 모드를 추천해요.");
    }
  }

  if (tips.length === 0) return null;

  return (
    <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200">
      <p className="text-sm font-semibold mb-2">🏸 운영 추천</p>
      <ul className="space-y-1.5">
        {tips.map((t, i) => (
          <li key={i} className="text-xs text-stone-600 flex items-start gap-1.5">
            <span style={{ color: "#4CAF50" }}>✓</span>
            <span>{t}</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("match");
  const [players, setPlayers] = useState([]);
  const [roster, setRoster] = useState([]);
  const [rosterReady, setRosterReady] = useState(false);
  const [manageMode, setManageMode] = useState(false);
  const [nameInput, setNameInput] = useState("");
  const [addError, setAddError] = useState("");
  const [showBackup, setShowBackup] = useState(false);
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [copyMsg, setCopyMsg] = useState("");
  const backupInputRef = useRef(null);
  const [numCourts, setNumCourts] = useState(2);
  const [meetingEndedDate, setMeetingEndedDate] = useState(null);
  const [hist, setHist] = useState(buildHistory());
  const [courtMatches, setCourtMatches] = useState({}); // { [courtNumber]: match | null }
  const [matchSeq, setMatchSeq] = useState(0);
  const [history, setHistory] = useState([]);
  const [syncMsg, setSyncMsg] = useState("");
  const [rsvp, setRsvp] = useState({});
  const [restWish, setRestWish] = useState({});
  const [matchhistory, setMatchhistory] = useState([]);
  const [statsAdjust, setStatsAdjust] = useState({});
  const [checkinlog, setCheckinlog] = useState([]);
  const [matchMode, setMatchMode] = useState("balance"); // "balance" | "skill"
  const [excluded, setExcluded] = useState([]);
  const [waitStart, setWaitStart] = useState({});
  const [lockedCourts, setLockedCourts] = useState([]);
  const [skillRankOffset, setSkillRankOffset] = useState(0);
  const [kindVotes, setKindVotes] = useState([]);
  const [schedule, setSchedule] = useState([]);
  const [myId, setMyId] = useState(() => localStorage.getItem("bm_myId") || null);
  const [pinOn, setPinOn] = useState(() => localStorage.getItem("bm_admin") === "1");
  const ADMIN_PIN = window.ADMIN_PIN;
  const adminOn = pinOn || isOfficerOf(roster, myId);

  const canGenerate = players.length >= 4 && numCourts >= 1;
  const maxCourts = Math.max(1, Math.floor(players.length / 4));

  function chooseIdentity(id) {
    localStorage.setItem("bm_myId", id);
    setMyId(id);
  }
  function resetIdentity() {
    localStorage.removeItem("bm_myId");
    setMyId(null);
  }
  async function tryAdminUnlock() {
    if (adminOn) return;
    const pin = await appPrompt("관리자 비밀번호를 입력하세요");
    if (pin === ADMIN_PIN) {
      localStorage.setItem("bm_admin", "1");
      setPinOn(true);
    } else if (pin !== null) {
      appAlert("비밀번호가 틀렸어요.");
    }
  }
  function adminLock() {
    localStorage.removeItem("bm_admin");
    setPinOn(false);
  }

  // ---- real-time sync from Firestore ----
  useEffect(() => {
    const unsub1 = ROSTER_REF.onSnapshot((snap) => {
      const data = snap.data();
      setRoster(data && data.members ? data.members : []);
      setRosterReady(true);
    }, () => setRosterReady(true));

    const unsub2 = CHECKIN_REF.onSnapshot((snap) => {
      const data = snap.data();
      setRsvp(data && data.data ? data.data : {});
    });

    const unsub3 = RESTWISH_REF.onSnapshot((snap) => {
      const data = snap.data();
      setRestWish(data && data.data ? data.data : {});
    });

    const unsub4 = REFS.matchhistory.onSnapshot((snap) => {
      const data = snap.data();
      setMatchhistory(data && data.items ? data.items : []);
    });

    const unsub5 = REFS.statsadjust.onSnapshot((snap) => {
      const data = snap.data();
      setStatsAdjust(data && data.data ? data.data : {});
    });

    const unsub6 = REFS.courtmatches.onSnapshot((snap) => {
      const data = snap.data();
      setCourtMatches(data && data.data ? data.data : {});
    }, () => {});

    const unsub7 = REFS.checkinlog.onSnapshot((snap) => {
      const data = snap.data();
      setCheckinlog(data && data.items ? data.items : []);
    }, () => {});

    const unsub8 = REFS.matchmode.onSnapshot((snap) => {
      const data = snap.data();
      const storedMode = (data && data.mode) || "balance";
      setMatchMode(["random", "social", "balance", "skill"].includes(storedMode) ? storedMode : "balance");
      setExcluded((data && data.excluded) || []);
      setWaitStart((data && data.waitStart) || {});
      setLockedCourts((data && data.lockedCourts) || []);
      setSkillRankOffset((data && data.skillRankOffset) || 0);
      if (data && data.numCourts) setNumCourts(data.numCourts);
      setMeetingEndedDate((data && data.meetingEndedDate) || null);
    }, () => {});

    const unsub9 = REFS.kindvotes.onSnapshot((snap) => {
      const data = snap.data();
      setKindVotes(data && data.items ? data.items : []);
    }, () => {});

    const unsub10 = REFS.schedule.onSnapshot((snap) => {
      const data = snap.data();
      setSchedule(data && data.items ? data.items : []);
    }, () => {});

    return () => {
      unsub1();
      unsub2();
      unsub3();
      unsub4();
      unsub5();
      unsub6();
      unsub7();
      unsub8();
      unsub9();
      unsub10();
    };
  }, []);

  // 매칭 모드 / 제외 회원 / 대기시작시각 / 코트 잠금 / 실력전 순위블록 오프셋을 한 문서에 같이 저장해요
  function persistMatchSettings(patch) {
    const next = {
      mode: patch.mode !== undefined ? patch.mode : matchMode,
      excluded: patch.excluded !== undefined ? patch.excluded : excluded,
      waitStart: patch.waitStart !== undefined ? patch.waitStart : waitStart,
      lockedCourts: patch.lockedCourts !== undefined ? patch.lockedCourts : lockedCourts,
      skillRankOffset: patch.skillRankOffset !== undefined ? patch.skillRankOffset : skillRankOffset,
      numCourts: patch.numCourts !== undefined ? patch.numCourts : numCourts,
      meetingEndedDate: patch.meetingEndedDate !== undefined ? patch.meetingEndedDate : meetingEndedDate,
    };
    setMatchMode(next.mode);
    setExcluded(next.excluded);
    setWaitStart(next.waitStart);
    setLockedCourts(next.lockedCourts);
    setSkillRankOffset(next.skillRankOffset);
    setNumCourts(next.numCourts);
    setMeetingEndedDate(next.meetingEndedDate);
    REFS.matchmode.set(next).catch(() => {});
  }

  const meetingEndedToday = meetingEndedDate === todayStr();
  async function endTodayMeeting() {
    if (!adminOn) return;
    if (!(await appConfirm("오늘 모임을 마칠까요? 이후 새 경기 시작이 막히고, 다들 투표하라는 안내가 떠요."))) return;
    persistMatchSettings({ meetingEndedDate: todayStr() });
  }
  function reopenTodayMeeting() {
    if (!adminOn) return;
    persistMatchSettings({ meetingEndedDate: null });
  }

  function markWaiting(ids) {
    const now = Date.now();
    const nextWait = { ...waitStart };
    ids.forEach((id) => { nextWait[id] = now; });
    persistMatchSettings({ waitStart: nextWait });
  }

  function toggleExcluded(id) {
    const next = excluded.includes(id) ? excluded.filter((x) => x !== id) : [...excluded, id];
    persistMatchSettings({ excluded: next });
  }

  function toggleCourtLock(courtNum) {
    const next = lockedCourts.includes(courtNum) ? lockedCourts.filter((x) => x !== courtNum) : [...lockedCourts, courtNum];
    persistMatchSettings({ lockedCourts: next });
  }

  function voteKind(courtNum) {
    const m = courtMatches[courtNum];
    if (!m || !myId) return;
    const allIds = [...m.teamA, ...m.teamB].map((p) => p.id);
    if (!allIds.includes(myId)) {
      appAlert("이 경기에 참여한 사람만 투표할 수 있어요.");
      return;
    }
    const already = kindVotes.some((v) => v.matchId === m.id && v.voterId === myId);
    if (already) return;
    const votedFor = allIds.filter((id) => id !== myId);
    const newVotes = votedFor.map((id) => ({ id: uid(), matchId: m.id, voterId: myId, votedForId: id, date: todayStr() }));
    const next = [...kindVotes, ...newVotes];
    setKindVotes(next);
    REFS.kindvotes.set({ items: next }).catch(() => {});
  }

  // 오늘 이 두 사람이 이미 몇 번 같이(파트너든 상대든) 경기했는지
  function todayPairCount(idA, idB) {
    const today = todayStr();
    let count = 0;
    matchhistory.forEach((m) => {
      if (m.date !== today) return;
      const ids = [...(m.teamA || []), ...(m.teamB || [])].map((p) => p.id);
      if (ids.includes(idA) && ids.includes(idB)) count++;
    });
    return count;
  }

  function isFirstTimer(id) {
    return checkinlog.filter((c) => c.memberId === id).length <= 1;
  }

  function isKindOrStrong(id) {
    const m = roster.find((r) => r.id === id);
    if (m && m.manualBadges && (m.manualBadges.kind || m.manualBadges.chat)) return true;
    return skillOf(id) >= 0.65;
  }

  // 코트별 진행중인 경기를 로컬 상태 + Firestore에 같이 저장해서, 다른 사람 화면에도 실시간으로 보여요
  function persistCourtMatches(next) {
    setCourtMatches(next);
    REFS.courtmatches.set({ data: next }).catch(() => {});
  }

  // 오늘 몇 경기 했는지 — matchhistory(공유 저장소) 기준이라 기기 상관없이 다 같이 봐요
  function todayGamesPlayed(id) {
    const today = todayStr();
    return matchhistory.filter(
      (m) => m.date === today && ((m.teamA || []).some((p) => p.id === id) || (m.teamB || []).some((p) => p.id === id))
    ).length;
  }

  // 통산 전적(승/패/경기수) — matchhistory(영구 저장)에서 계산 + 관리자 수동 보정값 반영
  function lifetimeStatsFor(id) {
    let games = 0, wins = 0, losses = 0;
    matchhistory.forEach((m) => {
      const inA = (m.teamA || []).some((p) => p.id === id);
      const inB = (m.teamB || []).some((p) => p.id === id);
      if (!inA && !inB) return;
      games++;
      const aWin = Number(m.scoreA) > Number(m.scoreB);
      const won = (inA && aWin) || (inB && !aWin);
      if (won) wins++; else losses++;
    });
    const adj = statsAdjust[id];
    if (adj) {
      wins += adj.winsAdj || 0;
      losses += adj.lossesAdj || 0;
      games += (adj.winsAdj || 0) + (adj.lossesAdj || 0);
    }
    return { games, wins: Math.max(0, wins), losses: Math.max(0, losses) };
  }

  const MIN_GAMES_FOR_TIER = 3;

  // 승률 기반 실력 등급(상/중/하) — 오늘 참석자 안에서 상대적으로 나눠요
  const tierMap = (() => {
    const withRate = players.map((p) => {
      const s = lifetimeStatsFor(p.id);
      const rate = s.games >= MIN_GAMES_FOR_TIER ? s.wins / s.games : null;
      return { id: p.id, rate };
    });
    const ranked = withRate.filter((p) => p.rate !== null).sort((a, b) => b.rate - a.rate);
    const n = ranked.length;
    const topCut = Math.ceil(n / 3);
    const midCut = Math.ceil((n * 2) / 3);
    const map = {};
    ranked.forEach((p, i) => {
      map[p.id] = i < topCut ? "상" : i < midCut ? "중" : "하";
    });
    withRate.forEach((p) => {
      if (map[p.id] === undefined) map[p.id] = "중"; // 경기 수 부족하면 중간 취급
    });
    return map;
  })();

  function skillOf(id) {
    const s = lifetimeStatsFor(id);
    if (s.games >= MIN_GAMES_FOR_TIER) return s.wins / s.games;
    // 경기 수가 적으면 가입할 때 스스로 고른 레벨을 대신 참고해요
    const m = roster.find((r) => r.id === id);
    const lvl = m && m.level;
    return (window.LEVEL_SKILL && window.LEVEL_SKILL[lvl]) || 0.5;
  }

  const tierBadge = { 상: { emoji: "🔥", color: "text-red-500" }, 중: { emoji: "➖", color: "text-stone-400" }, 하: { emoji: "🌱", color: "text-green-600" } };

  // 관리자가 개인 전적을 직접 원하는 값으로 고쳐요 (실제 경기기록은 그대로 두고, 보정값만 얹어요)
  async function correctPlayerStats(p) {
    const current = lifetimeStatsFor(p.id);
    const winInput = await appPrompt(`${p.name}님의 정확한 승 수를 입력해주세요`, String(current.wins));
    if (winInput === null) return;
    const lossInput = await appPrompt(`${p.name}님의 정확한 패 수를 입력해주세요`, String(current.losses));
    if (lossInput === null) return;
    const newWins = parseInt(winInput, 10);
    const newLosses = parseInt(lossInput, 10);
    if (isNaN(newWins) || isNaN(newLosses) || newWins < 0 || newLosses < 0) {
      appAlert("숫자를 정확히 입력해주세요.");
      return;
    }
    // 실제 경기기록 기준값과의 차이를 보정값으로 저장
    let rawGames = 0, rawWins = 0, rawLosses = 0;
    matchhistory.forEach((m) => {
      const inA = (m.teamA || []).some((x) => x.id === p.id);
      const inB = (m.teamB || []).some((x) => x.id === p.id);
      if (!inA && !inB) return;
      const aWin = Number(m.scoreA) > Number(m.scoreB);
      const won = (inA && aWin) || (inB && !aWin);
      if (won) rawWins++; else rawLosses++;
    });
    const next = { ...statsAdjust, [p.id]: { winsAdj: newWins - rawWins, lossesAdj: newLosses - rawLosses } };
    setStatsAdjust(next);
    REFS.statsadjust.set({ data: next }).catch(() => {});
  }

  // auto-sync: anyone who checks in as "참석" gets added to today's players automatically
  useEffect(() => {
    if (!roster.length) return;
    setPlayers((prev) => {
      const existingIds = new Set(prev.map((p) => p.id));
      const todayAttendees = todayScheduleAttendees(getEffectiveAttendanceEvents(schedule));
      const toAdd = todayAttendees.filter((a) => !existingIds.has(a.id)).map((a) => roster.find((m) => m.id === a.id) || a);
      if (!toAdd.length) return prev;
      return [
        ...prev,
        ...toAdd.map((m) => ({ id: m.id, name: m.name, gamesPlayed: 0, wins: 0, losses: 0 })),
      ];
    });
  }, [rsvp, roster, schedule]);

  function persistRoster(next) {
    setRoster(next);
    ROSTER_REF.set({ members: next }).catch(() => {});
  }

  function setMyRsvp(memberId, status) {
    const next = { ...rsvp, [memberId]: status };
    setRsvp(next);
    CHECKIN_REF.set({ data: next }).catch(() => {});
    if (status === "in") {
      logAttendance(memberId);
      markWaiting([memberId]);
      // 참석으로 표시하면 자동으로 오늘 참석자(매칭 대상) 명단에도 들어가요 — 따로 또 누를 필요 없어요
      setPlayers((p) => {
        if (p.some((x) => x.id === memberId)) return p;
        const m = roster.find((r) => r.id === memberId);
        if (!m) return p;
        return [...p, { id: m.id, name: m.name, gamesPlayed: 0, wins: 0, losses: 0 }];
      });
    } else if (status === "out") {
      setPlayers((p) => p.filter((x) => x.id !== memberId));
    }
  }

  function toggleRestWish(memberId) {
    const next = { ...restWish };
    if (next[memberId]) delete next[memberId];
    else next[memberId] = true;
    setRestWish(next);
    RESTWISH_REF.set({ data: next }).catch(() => {});
  }

  function clearRestWish() {
    setRestWish({});
    RESTWISH_REF.set({ data: {} }).catch(() => {});
  }

  async function resetCheckins() {
    if (!(await appConfirm("모든 체크인 기록을 초기화할까요? (참석/불참 전부 지워지고, 참석자 명단도 비워져요)"))) return;
    setRsvp({});
    CHECKIN_REF.set({ data: {} }).catch(() => {});
    setPlayers([]);
  }

  const backupCode = roster.map((m) => m.name).join(",");

  async function copyBackup() {
    if (!roster.length) {
      setCopyMsg("등록된 멤버가 없어요.");
      return;
    }
    let ok = false;
    try {
      await navigator.clipboard.writeText(backupCode);
      ok = true;
    } catch (e) {}
    if (!ok && backupInputRef.current) {
      try {
        backupInputRef.current.focus();
        backupInputRef.current.select();
        ok = document.execCommand("copy");
      } catch (e) {}
    }
    setCopyMsg(ok ? "복사됐어요!" : "자동 복사가 안 돼요. 위 박스를 탭해서 직접 복사해주세요.");
    setTimeout(() => setCopyMsg(""), 3000);
  }

  function importRoster() {
    const names = importText.split(",").map((n) => n.trim()).filter(Boolean);
    if (!names.length) {
      setImportMsg("붙여넣은 코드가 비어있어요.");
      return;
    }
    const existingNames = new Set(roster.map((m) => m.name));
    const added = names.filter((n) => !existingNames.has(n)).map((n) => ({ id: uid(), name: n }));
    if (!added.length) {
      setImportMsg("이미 다 등록되어 있는 멤버예요.");
      return;
    }
    persistRoster([...roster, ...added]);
    setImportMsg(`${added.length}명 복원 완료!`);
    setImportText("");
    setTimeout(() => setImportMsg(""), 3000);
  }

  function addRosterMember() {
    const name = nameInput.trim();
    if (!name) {
      setAddError("이름을 입력해주세요.");
      return;
    }
    if (roster.some((m) => m.name === name)) {
      setAddError(`"${name}"은(는) 이미 등록되어 있어요.`);
      return;
    }
    setAddError("");
    const member = { id: uid(), name };
    persistRoster([...roster, member]);
    setMyRsvp(member.id, "in");
    setNameInput("");
  }

  function removeRosterMember(id) {
    persistRoster(roster.filter((m) => m.id !== id));
    setPlayers((p) => p.filter((x) => x.id !== id));
  }

  function toggleAttend(member) {
    const already = players.some((x) => x.id === member.id);
    setMyRsvp(member.id, already ? "out" : "in");
  }

  function removePlayer(id) {
    if (String(id).startsWith("guest_")) {
      setPlayers((p) => p.filter((x) => x.id !== id));
      REFS.guestlist.get().then((snap) => {
        const data = snap.data() || {};
        const items = (data.items || []).filter((g) => g.id !== id);
        REFS.guestlist.set({ items }).catch(() => {});
      }).catch(() => {});
      return;
    }
    setMyRsvp(id, "out");
  }

  const [guestName, setGuestName] = useState("");
  const [guestlist, setGuestlist] = useState([]);

  useEffect(() => {
    const unsub = REFS.guestlist.onSnapshot((snap) => {
      const data = snap.data();
      setGuestlist(data && data.items ? data.items : []);
    }, () => {});
    return () => unsub();
  }, []);

  // 오늘 날짜로 등록된 게스트를 참석자 명단에 자동으로 채워요 — 이전엔 로컬 상태에만 있어서
  // 다른 페이지로 이동했다 돌아오면(=새로고침) 사라지는 버그가 있었어요. 이제 Firestore에 저장돼서 안 사라져요.
  useEffect(() => {
    const todayGuests = guestlist.filter((g) => g.date === todayStr());
    if (!todayGuests.length) return;
    setPlayers((prev) => {
      const existingIds = new Set(prev.map((p) => p.id));
      const toAdd = todayGuests.filter((g) => !existingIds.has(g.id));
      if (!toAdd.length) return prev;
      return [...prev, ...toAdd.map((g) => ({ id: g.id, name: `${g.name} (게스트)`, gamesPlayed: 0, wins: 0, losses: 0 }))];
    });
  }, [guestlist]);

  function addGuest() {
    if (!adminOn) { tryAdminUnlock(); return; }
    const trimmed = guestName.trim();
    if (!trimmed) return;
    const guestId = "guest_" + uid();
    const entry = { id: guestId, name: trimmed, date: todayStr() };
    setPlayers((p) => [...p, { id: guestId, name: `${trimmed} (게스트)`, gamesPlayed: 0, wins: 0, losses: 0 }]);
    REFS.guestlist.get().then((snap) => {
      const data = snap.data() || {};
      const items = [...(data.items || []), entry];
      REFS.guestlist.set({ items }).catch(() => {});
    }).catch(() => {
      REFS.guestlist.set({ items: [entry] }).catch(() => {});
    });
    setGuestName("");
  }

  const [justShuffled, setJustShuffled] = useState(false);

  // 현재 활성 매칭에 배정된(=아직 안 끝난) 선수 id 집합
  const occupiedIds = new Set();
  Object.values(courtMatches).forEach((m) => {
    if (m && !m.done && m.date === todayStr()) [...m.teamA, ...m.teamB].forEach((p) => occupiedIds.add(p.id));
  });

  // 대기 중(체크인 했지만 지금 안 뛰고 있는) 선수들 — 오래 쉰 사람 우선, 쉬고 싶어요/제외된 사람은 빠짐
  const waitingPlayers = players
    .filter((p) => !occupiedIds.has(p.id) && !restWish[p.id] && !excluded.includes(p.id))
    .sort((a, b) => {
      const wa = waitStart[a.id] || 0;
      const wb = waitStart[b.id] || 0;
      if (wa !== wb) return wa - wb; // 대기 시작이 이를수록(오래 쉬었을수록) 우선
      return todayGamesPlayed(a.id) - todayGamesPlayed(b.id) || Math.random() - 0.5;
    });

  const matchCtx = { hist, skillOf, mode: matchMode, todayPairCount, isFirstTimer, isKindOrStrong };

  // 실력전 모드: 대기 중인 사람을 실력순으로 줄세운 뒤, 4명씩 블록으로 나눠서 코트를 배정해요.
  // 블록 경계는 매번 한 칸씩 밀려서(오프셋 회전) 매번 같은 조합만 반복되지 않게 해요.
  // (예: 이번엔 1-4위/5-8위, 다음엔 2-5위/6-9위 ... 이렇게 밀리다 보면 1위와 8위가 한 그룹이 될 수도 있는데,
  //  그때도 팀은 실력 차가 가장 적은 조합으로 갈라서 항상 공평하게 만들어요.)
  function pickFourForCourt() {
    if (matchMode !== "skill") return waitingPlayers.slice(0, 4);
    const byRank = [...waitingPlayers].sort((a, b) => skillOf(b.id) - skillOf(a.id));
    const n = byRank.length;
    if (n < 4) return byRank;
    const start = skillRankOffset % n;
    // start 위치부터 4명(부족하면 앞에서부터 이어서) 뽑아요
    const four = [];
    for (let i = 0; i < 4; i++) four.push(byRank[(start + i) % n]);
    return four;
  }

  function startMatchOnCourt(courtNum) {
    if (!adminOn) {
      tryAdminUnlock();
      return;
    }
    if (meetingEndedToday) {
      appAlert("오늘 모임이 이미 종료됐어요. 다시 시작하려면 먼저 '모임 다시 열기'를 눌러주세요.");
      return;
    }
    if (lockedCourts.includes(courtNum)) {
      appAlert("이 코트는 잠겨있어요. 잠금을 풀고 다시 시도해주세요.");
      return;
    }
    if (waitingPlayers.length < 4) {
      appAlert("대기 중인 인원이 4명 미만이에요. 체크인/참석자를 확인해주세요.");
      return;
    }
    const four = pickFourForCourt();
    const { a, b } = splitScore(four, matchCtx);
    const match = { id: uid(), court: courtNum, teamA: a, teamB: b, scoreA: "", scoreB: "", done: false, date: todayStr() };
    persistCourtMatches({ ...courtMatches, [courtNum]: match });
    if (matchMode === "skill") persistMatchSettings({ skillRankOffset: skillRankOffset + 1 });
    setMatchSeq((n) => n + 1);
    setTab("match");
    setJustShuffled(true);
    setTimeout(() => setJustShuffled(false), 500);
  }

  // ---- 관리자가 직접 4명 골라서 코트에 배정하기 (+ 특정 두 명을 같은 팀으로 고정) ----
  const [manualCourt, setManualCourt] = useState(null);
  const [manualSelected, setManualSelected] = useState([]);
  const [pinnedPair, setPinnedPair] = useState([]);

  function toggleManualPick(id) {
    setManualSelected((sel) =>
      sel.includes(id) ? sel.filter((x) => x !== id) : sel.length < 4 ? [...sel, id] : sel
    );
    setPinnedPair((p) => p.filter((x) => x !== id)); // 선택 해제되면 고정도 같이 풀림
  }

  function togglePin(id) {
    setPinnedPair((p) => (p.includes(id) ? p.filter((x) => x !== id) : p.length < 2 ? [...p, id] : p));
  }

  function openManualPick(courtNum) {
    if (!adminOn) {
      tryAdminUnlock();
      return;
    }
    setManualCourt(courtNum);
    setManualSelected([]);
    setPinnedPair([]);
  }

  function cancelManualPick() {
    setManualCourt(null);
    setManualSelected([]);
    setPinnedPair([]);
  }

  function startCourtWithFour(courtNum, four) {
    let a, b;
    const pinnedInFour = pinnedPair.filter((id) => four.some((p) => p.id === id));
    if (pinnedInFour.length === 2) {
      // 고정된 두 명을 한 팀으로 묶고, 나머지 둘이 상대 팀
      a = four.filter((p) => pinnedInFour.includes(p.id));
      b = four.filter((p) => !pinnedInFour.includes(p.id));
    } else {
      ({ a, b } = splitScore(four, matchCtx));
    }
    const match = { id: uid(), court: courtNum, teamA: a, teamB: b, scoreA: "", scoreB: "", done: false, date: todayStr() };
    persistCourtMatches({ ...courtMatches, [courtNum]: match });
    setMatchSeq((n) => n + 1);
    setManualCourt(null);
    setManualSelected([]);
    setPinnedPair([]);
    setTab("match");
    setJustShuffled(true);
    setTimeout(() => setJustShuffled(false), 500);
  }

  function confirmManualStart(courtNum) {
    if (manualSelected.length !== 4) return;
    const four = players.filter((p) => manualSelected.includes(p.id));
    startCourtWithFour(courtNum, four);
  }

  // 지정한 몇 명만 고르고, 나머지는 대기열에서 무작위로 채워서 바로 시작
  function autoFillAndStart(courtNum) {
    if (manualSelected.length < 1 || manualSelected.length >= 4) return;
    const chosen = players.filter((p) => manualSelected.includes(p.id));
    const restPool = waitingPlayers.filter((p) => !manualSelected.includes(p.id));
    const shuffled = [...restPool].sort(() => Math.random() - 0.5);
    const need = 4 - chosen.length;
    if (shuffled.length < need) {
      appAlert(`대기 인원이 부족해요. (${need}명 더 필요해요)`);
      return;
    }
    const four = [...chosen, ...shuffled.slice(0, need)];
    startCourtWithFour(courtNum, four);
  }


  // 관리자: 이미 시작한(아직 안 끝난) 경기도 팀을 다시 섞어요
  function reshuffleCourt(courtNum) {
    if (!adminOn) { tryAdminUnlock(); return; }
    const m = courtMatches[courtNum];
    if (!m) return;
    const four = [...m.teamA, ...m.teamB];
    const { a, b } = splitScore(four, matchCtx);
    const match = { ...m, teamA: a, teamB: b, scoreA: "", scoreB: "" };
    persistCourtMatches({ ...courtMatches, [courtNum]: match });
  }

  function updateScore(courtNum, side, value) {
    if (!/^\d{0,2}$/.test(value)) return;
    const m = courtMatches[courtNum];
    if (!m) return;
    persistCourtMatches({ ...courtMatches, [courtNum]: { ...m, [side]: value } });
  }

  function finishMatch(courtNum) {
    const m = courtMatches[courtNum];
    if (!m || m.scoreA === "" || m.scoreB === "" || m.scoreA === m.scoreB) return;
    const aWin = Number(m.scoreA) > Number(m.scoreB);

    setPlayers((ps) =>
      ps.map((p) => {
        const inA = m.teamA.some((x) => x.id === p.id);
        const inB = m.teamB.some((x) => x.id === p.id);
        if (!inA && !inB) return p;
        const won = (inA && aWin) || (inB && !aWin);
        return {
          ...p,
          gamesPlayed: p.gamesPlayed + 1,
          wins: p.wins + (won ? 1 : 0),
          losses: p.losses + (won ? 0 : 1),
        };
      })
    );

    setHist((h) => {
      const nh = { partner: { ...h.partner }, opponent: { ...h.opponent } };
      bump(nh.partner, pKey(m.teamA[0].id, m.teamA[1].id));
      bump(nh.partner, pKey(m.teamB[0].id, m.teamB[1].id));
      m.teamA.forEach((a) => m.teamB.forEach((b) => bump(nh.opponent, pKey(a.id, b.id))));
      return nh;
    });

    const finished = { ...m, done: true };
    setHistory((hArr) => [{ ...finished, round: matchSeq }, ...hArr]);
    logMatchResult({
      round: matchSeq,
      court: m.court,
      teamA: m.teamA.map((p) => ({ id: p.id, name: p.name })),
      teamB: m.teamB.map((p) => ({ id: p.id, name: p.name })),
      scoreA: m.scoreA,
      scoreB: m.scoreB,
    });

    markWaiting([...m.teamA, ...m.teamB].map((p) => p.id)); // 방금 끝난 사람들은 지금부터 대기 시작
  }

                        waitingPlayers={waitingPlayers}
                        selected={manualSelected}
                        onToggle={toggleManualPick}
                        onConfirm={() => confirmManualStart(courtNum)}
                        onAutoFill={() => autoFillAndStart(courtNum)}
                        onCancel={cancelManualPick}
                        pinnedPair={pinnedPair}
                        onTogglePin={togglePin}
                      />
                    )}
                  </div>
                ) : (
                  <>
                    <div className="grid grid-cols-[1fr_auto_1fr] items-center px-4 py-4 gap-2">
                      <div className="text-right">
                        <p className="text-sm font-medium leading-tight">{m.teamA[0].name}</p>
                        <p className="text-sm font-medium leading-tight">{m.teamA[1].name}</p>
                      </div>
                      <div className="flex flex-col items-center gap-1">
                        <div className="w-px h-4 bg-stone-300" />
                        <span className="text-[10px] text-stone-400">VS</span>
                        <div className="w-px h-4 bg-stone-300" />
                      </div>
                      <div>
                        <p className="text-sm font-medium leading-tight">{m.teamB[0].name}</p>
                        <p className="text-sm font-medium leading-tight">{m.teamB[1].name}</p>
                      </div>
                    </div>
                    <div className="flex items-center justify-center gap-3 pb-4">
                      <input
                        disabled={m.done}
                        value={m.scoreA}
                        onChange={(e) => updateScore(courtNum, "scoreA", e.target.value)}
                        inputMode="numeric"
                        placeholder="0"
                        className="scorefont w-14 h-12 text-center text-xl rounded-xl border border-stone-300 bg-stone-50 disabled:bg-stone-100 disabled:text-stone-400"
                      />
                      <span className="text-stone-400">:</span>
                      <input
                        disabled={m.done}
                        value={m.scoreB}
                        onChange={(e) => updateScore(courtNum, "scoreB", e.target.value)}
                        inputMode="numeric"
                        placeholder="0"
                        className="scorefont w-14 h-12 text-center text-xl rounded-xl border border-stone-300 bg-stone-50 disabled:bg-stone-100 disabled:text-stone-400"
                      />
                    </div>
                    {!m.done ? (
                      <div className="px-4 pb-4 space-y-2">
                        <button
                          onClick={() => finishMatch(courtNum)}
                          disabled={m.scoreA === "" || m.scoreB === "" || m.scoreA === m.scoreB}
                          className="w-full py-2.5 text-sm font-semibold bg-[#FFD54F] text-[#5c4a00] disabled:bg-stone-200 disabled:text-stone-400 rounded-xl"
                        >
                          경기 종료
                        </button>
                        {adminOn && (
                          <button onClick={() => reshuffleCourt(courtNum)} className="w-full py-2 text-xs font-semibold border border-stone-200 text-stone-500 rounded-xl">
                            🔀 팀 다시 섞기
                          </button>
                        )}
                      </div>
                    ) : meetingEndedToday ? (
                      <div className="px-4 pb-4">
                        <p className="text-xs text-stone-400 text-center">🏁 오늘 모임이 종료됐어요.</p>
                      </div>
                    ) : !adminOn ? (
                      <div className="px-4 pb-4">
                        <p className="text-xs text-stone-400 text-center">경기가 끝났어요. 곧 다음 경기가 시작될 거예요.</p>
                      </div>
                    ) : !isManualHere ? (
                      <div className="px-4 pb-4 space-y-2">
                        {waitingPlayers.length < 4 && (
                          <p className="text-xs font-medium text-center" style={{ color: "#B98900" }}>
                            ⚠️ {4 - waitingPlayers.length}명이 부족해요. (대기 {waitingPlayers.length}명 / 4명 필요)
                          </p>
                        )}
                        <button
                          onClick={() => startMatchOnCourt(courtNum)}
                          disabled={waitingPlayers.length < 4}
                          className="w-full py-2.5 text-sm font-semibold bg-[#4CAF50] text-white rounded-xl disabled:bg-stone-200 disabled:text-stone-400"
                        >
                          🔀 이 코트 다음 경기 시작
                        </button>
                        <button
                          onClick={() => openManualPick(courtNum)}
                          className="w-full rounded-xl py-2 text-xs font-semibold border"
                          style={{ borderColor: "#FFD54F", color: "#B98900" }}
                        >
                          ✋ 직접 4명 선택해서 시작
                        </button>
                      </div>
                    ) : (
                      <div className="px-4 pb-4">
                        <ManualPicker
                          waitingPlayers={waitingPlayers}
                          selected={manualSelected}
                          onToggle={toggleManualPick}
                          onConfirm={() => confirmManualStart(courtNum)}
                        onAutoFill={() => autoFillAndStart(courtNum)}
                          onCancel={cancelManualPick}
                          pinnedPair={pinnedPair}
                          onTogglePin={togglePin}
                        />
                      </div>
                    )}
                  </>
                )}
              </div>
            );
          })}

          <div className="bg-white rounded-2xl p-4 border border-stone-200">
            <p className="text-xs font-semibold text-stone-500 mb-1">다음 경기는 쉴래요</p>
            <p className="text-xs text-stone-400 mb-2">본인 이름은 언제든 누를 수 있고, 관리자는 다른 사람 대신 눌러줄 수도 있어요. 누르면 다음 경기 시작할 때 대기 명단에서 빠져요. 아래 목록은 관리자를 포함해 모두에게 실시간으로 보여요.</p>
            {Object.keys(restWish).length > 0 && (
              <p className="text-xs font-semibold mb-2" style={{ color: "#4CAF50" }}>
                ✋ 쉬고 싶어하는 사람: {players.filter((p) => restWish[p.id]).map((p) => p.name).join(", ") || "-"}
              </p>
            )}
            <div className="flex flex-wrap gap-2">
              {players.map((p) => {
                const wantsRest = !!restWish[p.id];
                const isMe = p.id === myId;
                const canToggle = isMe || adminOn;
                return (
                  <button
                    key={p.id}
                    disabled={!canToggle}
                    onClick={() => toggleRestWish(p.id)}
                    className={`px-3 py-1.5 rounded-full text-xs border transition ${
                      wantsRest ? "bg-stone-800 text-white border-stone-800" : "bg-stone-50 text-stone-500 border-stone-200"
                    } ${!canToggle ? "opacity-40 cursor-not-allowed" : ""}`}
                  >
                    {p.name} {wantsRest ? "· 쉼" : ""}
                  </button>
                );
              })}
            </div>
          </div>
        </section>
      )}

      {tab === "record" && (
        <section className="px-5 mt-5 space-y-5">
          <div>
            <p className="text-sm font-semibold mb-2">🏆 통산 순위</p>
            <p className="text-[11px] text-stone-400 mb-2">기록은 저장돼서 새로고침해도 사라지지 않아요.</p>
            <ul className="space-y-2">
              {[...players]
                .map((p) => ({ ...p, stats: lifetimeStatsFor(p.id) }))
                .sort((a, b) => b.stats.wins - a.stats.wins || b.stats.games - a.stats.games)
                .map((p, i) => (
                  <li key={p.id} className="bg-white rounded-xl px-4 py-3 flex items-center justify-between border border-stone-200">
                    <div className="flex items-center gap-3">
                      <span className="scorefont text-sm text-stone-400 w-4">{i + 1}</span>
                      <span className="text-sm font-medium">{p.name}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="scorefont text-sm text-stone-500">{p.stats.wins}승 {p.stats.losses}패</span>
                      {adminOn && (
                        <button onClick={() => correctPlayerStats(p)} className="text-[11px] text-stone-400 underline underline-offset-2">
                          수정
                        </button>
                      )}
                    </div>
                  </li>
                ))}
              {players.length === 0 && (
                <p className="text-sm text-stone-400 bg-white rounded-2xl p-5 text-center border border-dashed border-stone-300">
                  참석자를 먼저 등록해주세요.
                </p>
              )}
            </ul>
          </div>

          <div>
            <p className="text-sm font-semibold mb-2">📋 경기 기록</p>
            <p className="text-[11px] text-stone-400 mb-2">저장돼서 새로고침해도 안 사라져요.</p>
            {matchhistory.length === 0 ? (
              <p className="text-sm text-stone-400 bg-white rounded-2xl p-5 text-center border border-dashed border-stone-300">
                아직 종료된 경기가 없어요.
              </p>
            ) : (
              <ul className="space-y-2">
                {matchhistory.slice(0, 50).map((m) => (
                  <li key={m.id} className="bg-white rounded-xl px-4 py-3 border border-stone-200 text-sm">
                    <p className="text-[11px] text-stone-400 mb-1">{m.date} · Court {m.court}</p>
                    <div className="flex justify-between items-center">
                      <span>{m.teamA[0].name}·{m.teamA[1].name}</span>
                      <span className="scorefont font-semibold">{m.scoreA} : {m.scoreB}</span>
                      <span>{m.teamB[0].name}·{m.teamB[1].name}</span>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </section>
      )}

      <BottomNav active="match" />
      <AppModalHost />
    </div>
    </RequireLogin>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
