<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>랜덤매칭 | Birdie Club</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<body>
<div id="root"></div>
<script type="text/babel" src="./app.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const db = window.db;
const ROSTER_REF = window.REFS.roster;
const CHECKIN_REF = window.REFS.checkin;
const RESTWISH_REF = window.REFS.restwish;

// ---------- helpers ----------
const pKey = (a, b) => [a, b].sort().join("|");

function buildHistory() {
  return { partner: {}, opponent: {} };
}
function bump(map, key) {
  map[key] = (map[key] || 0) + 1;
}

// score a single 4-person court split
function splitScore(four, hist, skillOf) {
  const splits = [
    [[four[0], four[1]], [four[2], four[3]]],
    [[four[0], four[2]], [four[1], four[3]]],
    [[four[0], four[3]], [four[1], four[2]]],
  ];
  let best = null;
  for (const [a, b] of splits) {
    const historyScore =
      (hist.partner[pKey(a[0].id, a[1].id)] || 0) * 3 +
      (hist.partner[pKey(b[0].id, b[1].id)] || 0) * 3 +
      (hist.opponent[pKey(a[0].id, b[0].id)] || 0) +
      (hist.opponent[pKey(a[0].id, b[1].id)] || 0) +
      (hist.opponent[pKey(a[1].id, b[0].id)] || 0) +
      (hist.opponent[pKey(a[1].id, b[1].id)] || 0);
    // 실력 밸런스: 두 팀의 평균 승률 차이가 클수록 페널티 (잘하는 사람끼리 몰리는 것 방지)
    const skillGap = skillOf
      ? Math.abs(
          (skillOf(a[0].id) + skillOf(a[1].id)) / 2 - (skillOf(b[0].id) + skillOf(b[1].id)) / 2
        ) * 8
      : 0;
    const s = historyScore + skillGap;
    if (!best || s < best.s) best = { s, a, b };
  }
  return best;
}

function generateRound(players, numCourts, hist, restIds = new Set(), skillOf = null) {
  const forcedRest = players.filter((p) => restIds.has(p.id));
  const pool = players.filter((p) => !restIds.has(p.id));

  const need = numCourts * 4;
  const sorted = [...pool].sort(
    (a, b) => a.gamesPlayed - b.gamesPlayed || Math.random() - 0.5
  );
  const playing = sorted.slice(0, need);
  const usable = playing.slice(0, Math.floor(playing.length / 4) * 4);
  const resting = [...forcedRest, ...sorted.slice(usable.length)];

  let bestAssignment = null;
  let bestTotal = Infinity;
  for (let t = 0; t < 40; t++) {
    const shuffled = [...usable].sort(() => Math.random() - 0.5);
    let total = 0;
    const courts = [];
    for (let i = 0; i < shuffled.length; i += 4) {
      const four = shuffled.slice(i, i + 4);
      const { s, a, b } = splitScore(four, hist, skillOf);
      total += s;
      courts.push({ teamA: a, teamB: b });
    }
    if (total < bestTotal) {
      bestTotal = total;
      bestAssignment = courts;
    }
  }

  const matches = (bestAssignment || []).map((c, idx) => ({
    id: uid(),
    court: idx + 1,
    teamA: c.teamA,
    teamB: c.teamB,
    scoreA: "",
    scoreB: "",
    done: false,
  }));

  return { matches, resting };
}

// ---------- main app ----------
function App() {
  const [tab, setTab] = useState("players");
  const [players, setPlayers] = useState([]);
  const [roster, setRoster] = useState([]);
  const [rosterReady, setRosterReady] = useState(false);
  const [manageMode, setManageMode] = useState(false);
  const [nameInput, setNameInput] = useState("");
  const [addError, setAddError] = useState("");
  const [showBackup, setShowBackup] = useState(false);
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [copyMsg, setCopyMsg] = useState("");
  const backupInputRef = useRef(null);
  const [numCourts, setNumCourts] = useState(2);
  const [hist, setHist] = useState(buildHistory());
  const [round, setRound] = useState(null);
  const [roundNum, setRoundNum] = useState(0);
  const [history, setHistory] = useState([]);
  const [syncMsg, setSyncMsg] = useState("");
  const [rsvp, setRsvp] = useState({});
  const [restWish, setRestWish] = useState({});
  const [matchhistory, setMatchhistory] = useState([]);
  const [statsAdjust, setStatsAdjust] = useState({});
  const [myId, setMyId] = useState(() => localStorage.getItem("bm_myId") || null);
  const [pinOn, setPinOn] = useState(() => localStorage.getItem("bm_admin") === "1");
  const ADMIN_PIN = window.ADMIN_PIN;
  const adminOn = pinOn || isOfficerOf(roster, myId);

  const canGenerate = players.length >= 4 && numCourts >= 1;
  const maxCourts = Math.max(1, Math.floor(players.length / 4));

  function chooseIdentity(id) {
    localStorage.setItem("bm_myId", id);
    setMyId(id);
  }
  function resetIdentity() {
    localStorage.removeItem("bm_myId");
    setMyId(null);
  }
  function tryAdminUnlock() {
    if (adminOn) return;
    const pin = window.prompt("관리자 비밀번호를 입력하세요");
    if (pin === ADMIN_PIN) {
      localStorage.setItem("bm_admin", "1");
      setPinOn(true);
    } else if (pin !== null) {
      window.alert("비밀번호가 틀렸어요.");
    }
  }
  function adminLock() {
    localStorage.removeItem("bm_admin");
    setPinOn(false);
  }

  // ---- real-time sync from Firestore ----
  useEffect(() => {
    const unsub1 = ROSTER_REF.onSnapshot((snap) => {
      const data = snap.data();
      setRoster(data && data.members ? data.members : []);
      setRosterReady(true);
    }, () => setRosterReady(true));

    const unsub2 = CHECKIN_REF.onSnapshot((snap) => {
      const data = snap.data();
      setRsvp(data && data.data ? data.data : {});
    });

    const unsub3 = RESTWISH_REF.onSnapshot((snap) => {
      const data = snap.data();
      setRestWish(data && data.data ? data.data : {});
    });

    const unsub4 = REFS.matchhistory.onSnapshot((snap) => {
      const data = snap.data();
      setMatchhistory(data && data.items ? data.items : []);
    });

    const unsub5 = REFS.statsadjust.onSnapshot((snap) => {
      const data = snap.data();
      setStatsAdjust(data && data.data ? data.data : {});
    });

    return () => {
      unsub1();
      unsub2();
      unsub3();
      unsub4();
      unsub5();
    };
  }, []);

  // 통산 전적(승/패/경기수) — matchhistory(영구 저장)에서 계산 + 관리자 수동 보정값 반영
  function lifetimeStatsFor(id) {
    let games = 0, wins = 0, losses = 0;
    matchhistory.forEach((m) => {
      const inA = (m.teamA || []).some((p) => p.id === id);
      const inB = (m.teamB || []).some((p) => p.id === id);
      if (!inA && !inB) return;
      games++;
      const aWin = Number(m.scoreA) > Number(m.scoreB);
      const won = (inA && aWin) || (inB && !aWin);
      if (won) wins++; else losses++;
    });
    const adj = statsAdjust[id];
    if (adj) {
      wins += adj.winsAdj || 0;
      losses += adj.lossesAdj || 0;
      games += (adj.winsAdj || 0) + (adj.lossesAdj || 0);
    }
    return { games, wins: Math.max(0, wins), losses: Math.max(0, losses) };
  }

  const MIN_GAMES_FOR_TIER = 3;

  // 승률 기반 실력 등급(상/중/하) — 오늘 참석자 안에서 상대적으로 나눠요
  const tierMap = (() => {
    const withRate = players.map((p) => {
      const s = lifetimeStatsFor(p.id);
      const rate = s.games >= MIN_GAMES_FOR_TIER ? s.wins / s.games : null;
      return { id: p.id, rate };
    });
    const ranked = withRate.filter((p) => p.rate !== null).sort((a, b) => b.rate - a.rate);
    const n = ranked.length;
    const topCut = Math.ceil(n / 3);
    const midCut = Math.ceil((n * 2) / 3);
    const map = {};
    ranked.forEach((p, i) => {
      map[p.id] = i < topCut ? "상" : i < midCut ? "중" : "하";
    });
    withRate.forEach((p) => {
      if (map[p.id] === undefined) map[p.id] = "중"; // 경기 수 부족하면 중간 취급
    });
    return map;
  })();

  function skillOf(id) {
    const s = lifetimeStatsFor(id);
    return s.games >= MIN_GAMES_FOR_TIER ? s.wins / s.games : 0.5;
  }

  const tierBadge = { 상: { emoji: "🔥", color: "text-red-500" }, 중: { emoji: "➖", color: "text-stone-400" }, 하: { emoji: "🌱", color: "text-green-600" } };

  // 관리자가 개인 전적을 직접 원하는 값으로 고쳐요 (실제 경기기록은 그대로 두고, 보정값만 얹어요)
  function correctPlayerStats(p) {
    const current = lifetimeStatsFor(p.id);
    const winInput = window.prompt(`${p.name}님의 정확한 승 수를 입력해주세요`, String(current.wins));
    if (winInput === null) return;
    const lossInput = window.prompt(`${p.name}님의 정확한 패 수를 입력해주세요`, String(current.losses));
    if (lossInput === null) return;
    const newWins = parseInt(winInput, 10);
    const newLosses = parseInt(lossInput, 10);
    if (isNaN(newWins) || isNaN(newLosses) || newWins < 0 || newLosses < 0) {
      window.alert("숫자를 정확히 입력해주세요.");
      return;
    }
    // 실제 경기기록 기준값과의 차이를 보정값으로 저장
    let rawGames = 0, rawWins = 0, rawLosses = 0;
    matchhistory.forEach((m) => {
      const inA = (m.teamA || []).some((x) => x.id === p.id);
      const inB = (m.teamB || []).some((x) => x.id === p.id);
      if (!inA && !inB) return;
      const aWin = Number(m.scoreA) > Number(m.scoreB);
      const won = (inA && aWin) || (inB && !aWin);
      if (won) rawWins++; else rawLosses++;
    });
    const next = { ...statsAdjust, [p.id]: { winsAdj: newWins - rawWins, lossesAdj: newLosses - rawLosses } };
    setStatsAdjust(next);
    REFS.statsadjust.set({ data: next }).catch(() => {});
  }

  // auto-sync: anyone who checks in as "참석" gets added to today's players automatically
  useEffect(() => {
    if (!roster.length) return;
    setPlayers((prev) => {
      const existingIds = new Set(prev.map((p) => p.id));
      const toAdd = roster.filter((m) => rsvp[m.id] === "in" && !existingIds.has(m.id));
      if (!toAdd.length) return prev;
      return [
        ...prev,
        ...toAdd.map((m) => ({ id: m.id, name: m.name, gamesPlayed: 0, wins: 0, losses: 0 })),
      ];
    });
  }, [rsvp, roster]);

  function persistRoster(next) {
    setRoster(next);
    ROSTER_REF.set({ members: next }).catch(() => {});
  }

  function setMyRsvp(memberId, status) {
    const next = { ...rsvp, [memberId]: status };
    setRsvp(next);
    CHECKIN_REF.set({ data: next }).catch(() => {});
    if (status === "in") logAttendance(memberId);
  }

  function toggleRestWish(memberId) {
    const next = { ...restWish };
    if (next[memberId]) delete next[memberId];
    else next[memberId] = true;
    setRestWish(next);
    RESTWISH_REF.set({ data: next }).catch(() => {});
  }

  function clearRestWish() {
    setRestWish({});
    RESTWISH_REF.set({ data: {} }).catch(() => {});
  }

  function resetCheckins() {
    if (!window.confirm("모든 체크인 기록을 초기화할까요? (참석/불참 전부 지워짐)")) return;
    setRsvp({});
    CHECKIN_REF.set({ data: {} }).catch(() => {});
  }

  const backupCode = roster.map((m) => m.name).join(",");

  async function copyBackup() {
    if (!roster.length) {
      setCopyMsg("등록된 멤버가 없어요.");
      return;
    }
    let ok = false;
    try {
      await navigator.clipboard.writeText(backupCode);
      ok = true;
    } catch (e) {}
    if (!ok && backupInputRef.current) {
      try {
        backupInputRef.current.focus();
        backupInputRef.current.select();
        ok = document.execCommand("copy");
      } catch (e) {}
    }
    setCopyMsg(ok ? "복사됐어요!" : "자동 복사가 안 돼요. 위 박스를 탭해서 직접 복사해주세요.");
    setTimeout(() => setCopyMsg(""), 3000);
  }

  function importRoster() {
    const names = importText.split(",").map((n) => n.trim()).filter(Boolean);
    if (!names.length) {
      setImportMsg("붙여넣은 코드가 비어있어요.");
      return;
    }
    const existingNames = new Set(roster.map((m) => m.name));
    const added = names.filter((n) => !existingNames.has(n)).map((n) => ({ id: uid(), name: n }));
    if (!added.length) {
      setImportMsg("이미 다 등록되어 있는 멤버예요.");
      return;
    }
    persistRoster([...roster, ...added]);
    setImportMsg(`${added.length}명 복원 완료!`);
    setImportText("");
    setTimeout(() => setImportMsg(""), 3000);
  }

  function addRosterMember() {
    const name = nameInput.trim();
    if (!name) {
      setAddError("이름을 입력해주세요.");
      return;
    }
    if (roster.some((m) => m.name === name)) {
      setAddError(`"${name}"은(는) 이미 등록되어 있어요.`);
      return;
    }
    setAddError("");
    const member = { id: uid(), name };
    persistRoster([...roster, member]);
    setPlayers((p) => [
      ...p,
      { id: member.id, name: member.name, gamesPlayed: 0, wins: 0, losses: 0 },
    ]);
    setNameInput("");
  }

  function removeRosterMember(id) {
    persistRoster(roster.filter((m) => m.id !== id));
    setPlayers((p) => p.filter((x) => x.id !== id));
  }

  function toggleAttend(member) {
    setPlayers((p) =>
      p.some((x) => x.id === member.id)
        ? p.filter((x) => x.id !== member.id)
        : [...p, { id: member.id, name: member.name, gamesPlayed: 0, wins: 0, losses: 0 }]
    );
  }

  function removePlayer(id) {
    setPlayers((p) => p.filter((x) => x.id !== id));
  }

  const [justShuffled, setJustShuffled] = useState(false);

  function handleGenerate() {
    if (!adminOn) {
      tryAdminUnlock();
      return;
    }
    const courts = Math.min(numCourts, maxCourts);
    const restIds = new Set(Object.keys(restWish));
    const { matches, resting } = generateRound(players, courts, hist, restIds, skillOf);
    setRound({ matches, resting });
    setRoundNum((n) => n + 1);
    setTab("match");
    clearRestWish();
    setJustShuffled(true);
    setTimeout(() => setJustShuffled(false), 500);
  }

  function updateScore(matchId, side, value) {
    if (!/^\d{0,2}$/.test(value)) return;
    setRound((r) => ({
      ...r,
      matches: r.matches.map((m) => (m.id === matchId ? { ...m, [side]: value } : m)),
    }));
  }

  function finishMatch(matchId) {
    setRound((r) => {
      const m = r.matches.find((x) => x.id === matchId);
      if (!m || m.scoreA === "" || m.scoreB === "" || m.scoreA === m.scoreB) return r;
      const aWin = Number(m.scoreA) > Number(m.scoreB);

      setPlayers((ps) =>
        ps.map((p) => {
          const inA = m.teamA.some((x) => x.id === p.id);
          const inB = m.teamB.some((x) => x.id === p.id);
          if (!inA && !inB) return p;
          const won = (inA && aWin) || (inB && !aWin);
          return {
            ...p,
            gamesPlayed: p.gamesPlayed + 1,
            wins: p.wins + (won ? 1 : 0),
            losses: p.losses + (won ? 0 : 1),
          };
        })
      );

      setHist((h) => {
        const nh = { partner: { ...h.partner }, opponent: { ...h.opponent } };
        bump(nh.partner, pKey(m.teamA[0].id, m.teamA[1].id));
        bump(nh.partner, pKey(m.teamB[0].id, m.teamB[1].id));
        m.teamA.forEach((a) => m.teamB.forEach((b) => bump(nh.opponent, pKey(a.id, b.id))));
        return nh;
      });

      const finished = { ...m, done: true };
      setHistory((hArr) => [{ ...finished, round: roundNum }, ...hArr]);
      logMatchResult({
        round: roundNum,
        court: m.court,
        teamA: m.teamA.map((p) => ({ id: p.id, name: p.name })),
        teamB: m.teamB.map((p) => ({ id: p.id, name: p.name })),
        scoreA: m.scoreA,
        scoreB: m.scoreB,
      });

      return { ...r, matches: r.matches.map((x) => (x.id === matchId ? finished : x)) };
    });
  }

  const allDone = round && round.matches.every((m) => m.done);

  return (
    <div className="min-h-screen bg-white text-stone-900 pb-24 font-sans">
      <TopHeader title="🎲 랜덤매칭" subtitle="오늘 코트 매칭을 만들어봐요" />

      <section className="px-5 max-w-2xl mx-auto mb-4 flex items-center justify-between">
        <div className="flex gap-3 text-xs text-stone-500">
          <span>참석 <b className="text-stone-800">{players.length}</b>명</span>
          <span>·</span>
          <span>코트 <b className="text-stone-800">{numCourts}</b>면</span>
          {roundNum > 0 && (
            <>
              <span>·</span>
              <span><b className="text-stone-800">{roundNum}</b>라운드 진행</span>
            </>
          )}
        </div>
        <button
          onClick={adminOn ? adminLock : tryAdminUnlock}
          className={`text-[11px] px-3 py-1.5 rounded-full border shrink-0 ${
            adminOn ? "text-white border-transparent" : "text-stone-400 border-stone-200"
          }`}
          style={adminOn ? { backgroundColor: "#4CAF50" } : {}}
        >
          {adminOn ? "🔓 관리자" : "🔒 관리자"}
        </button>
      </section>

      {/* top segmented sub-tabs (page-internal navigation) */}
      <section className="px-5 max-w-2xl mx-auto mb-5">
        <div className="flex gap-1.5 bg-stone-50 rounded-2xl p-1.5 border border-stone-100">
          {[
            { key: "players", label: "참석자", emoji: "👥" },
            { key: "checkin", label: "체크인", emoji: "✅" },
            { key: "match", label: "매칭", emoji: "🔀" },
            { key: "record", label: "기록", emoji: "🏆" },
          ].map(({ key, label, emoji }) => (
            <button
              key={key}
              onClick={() => setTab(key)}
              className={`flex-1 py-2 rounded-xl text-xs font-semibold tap-scale flex items-center justify-center gap-1 transition ${
                tab === key ? "text-white shadow-sm" : "text-stone-400"
              }`}
              style={tab === key ? { backgroundColor: "#4CAF50" } : {}}
            >
              <span>{emoji}</span>{label}
            </button>
          ))}
        </div>
      </section>

      {tab === "players" && (
        <section className="px-5 mt-5 space-y-5">
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200">
            <div className="flex items-center justify-between mb-3">
              <p className="text-sm font-semibold flex items-center gap-1">👥 고정 멤버</p>
              <button
                onClick={() => setManageMode((v) => !v)}
                className="text-xs text-stone-400 underline underline-offset-2"
              >
                {manageMode ? "완료" : "명단 관리"}
              </button>
            </div>

            {!rosterReady ? (
              <p className="text-xs text-stone-400 py-2">불러오는 중...</p>
            ) : roster.length === 0 ? (
              <p className="text-xs text-stone-400 py-2">등록된 멤버가 없어요. 아래에서 이름을 추가해보세요.</p>
            ) : (
              <>
                <p className="text-xs text-stone-400 mb-2">
                  {manageMode ? "탭하면 명단에서 완전히 삭제돼요." : "탭해서 오늘 참석을 체크하세요."}
                </p>
                <div className="flex flex-wrap gap-2 mb-4">
                  {roster.map((m) => {
                    const attending = players.some((p) => p.id === m.id);
                    return manageMode ? (
                      <button
                        key={m.id}
                        onClick={() => removeRosterMember(m.id)}
                        className="flex items-center gap-1 px-3 py-1.5 rounded-full text-sm bg-red-50 text-red-500 border border-red-200"
                      >
                        {m.name} ✕
                      </button>
                    ) : (
                      <button
                        key={m.id}
                        onClick={() => toggleAttend(m)}
                        className={`px-3 py-1.5 rounded-full text-sm border transition ${
                          attending
                            ? "bg-[#4CAF50] text-white border-[#4CAF50]"
                            : "bg-stone-50 text-stone-500 border-stone-200"
                        }`}
                      >
                        {m.name}
                      </button>
                    );
                  })}
                </div>
              </>
            )}

            <div className="flex gap-2">
              <input
                value={nameInput}
                onChange={(e) => {
                  setNameInput(e.target.value);
                  if (addError) setAddError("");
                }}
                onKeyDown={(e) => e.key === "Enter" && addRosterMember()}
                placeholder="새 멤버 이름"
                className="flex-1 rounded-xl border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#4CAF50]"
              />
              <button
                onClick={addRosterMember}
                className="bg-[#4CAF50] text-white rounded-xl px-4 flex items-center gap-1 active:scale-95 transition"
              >
                + 등록
              </button>
            </div>
            {addError && <p className="text-xs text-red-500 mt-1.5">{addError}</p>}
            <p className="text-[11px] text-[#4CAF50] mt-2">🔄 이 명단은 이제 모두에게 실시간으로 공유돼요.</p>

            <button
              onClick={() => setShowBackup((v) => !v)}
              className="text-xs text-[#4CAF50] underline underline-offset-2 mt-3"
            >
              {showBackup ? "백업/복원 닫기" : "명단 백업/복원하기"}
            </button>

            {showBackup && (
              <div className="mt-3 space-y-3 bg-stone-50 rounded-xl p-3 border border-stone-200">
                <div>
                  <p className="text-xs font-semibold text-stone-500 mb-1">지금 명단 백업하기</p>
                  <input
                    ref={backupInputRef}
                    readOnly
                    value={backupCode || "등록된 멤버가 없어요"}
                    onClick={(e) => e.target.select()}
                    onFocus={(e) => e.target.select()}
                    className="w-full bg-white border border-stone-200 rounded-lg px-3 py-2 text-xs scorefont"
                  />
                  <button
                    onClick={copyBackup}
                    className="mt-2 w-full bg-[#4CAF50] text-white rounded-lg py-2 text-xs font-semibold"
                  >
                    코드 복사하기
                  </button>
                  {copyMsg && <p className="text-xs text-[#4CAF50] mt-1">{copyMsg}</p>}
                </div>
                <div>
                  <p className="text-xs font-semibold text-stone-500 mb-1">코드로 복원하기</p>
                  <textarea
                    value={importText}
                    onChange={(e) => setImportText(e.target.value)}
                    placeholder="붙여넣기: 리리,밍크크,철수"
                    className="w-full rounded-lg border border-stone-300 px-3 py-2 text-xs h-16 focus:outline-none focus:ring-2 focus:ring-[#4CAF50]"
                  />
                  <button
                    onClick={importRoster}
                    className="mt-2 w-full bg-stone-800 text-white rounded-lg py-2 text-xs font-semibold"
                  >
                    복원하기
                  </button>
                  {importMsg && <p className="text-xs text-[#4CAF50] mt-1">{importMsg}</p>}
                </div>
              </div>
            )}
          </div>

          <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200">
            <p className="text-sm font-semibold mb-2">사용할 코트 수</p>
            <div className="flex items-center gap-3">
              <button
                onClick={() => setNumCourts((n) => Math.max(1, n - 1))}
                className="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center"
              >
                −
              </button>
              <span className="scorefont text-xl w-8 text-center">{numCourts}</span>
              <button
                onClick={() => setNumCourts((n) => n + 1)}
                className="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center"
              >
                +
              </button>
              <span className="text-xs text-stone-400">(최대 {maxCourts || 0}면 · 4명당 1코트)</span>
            </div>
          </div>

          <div>
            <p className="text-sm font-semibold mb-2">오늘 참석자 ({players.length}명)</p>
            <p className="text-[11px] text-[#4CAF50] mb-1">🔄 체크인에서 "참석" 누르면 자동으로 여기 반영돼요.</p>
            <p className="text-[11px] text-stone-400 mb-2">🔥상위 · ➖중위 · 🌱하위 등급으로 나눠서, 매칭 생성할 때 자동으로 실력 밸런스를 맞춰요. (최소 {MIN_GAMES_FOR_TIER}경기 이상부터 등급 계산돼요)</p>
            {players.length === 0 ? (
              <p className="text-sm text-stone-400 bg-white rounded-2xl p-5 text-center border border-dashed border-stone-300">
                위 고정 멤버를 탭해서 오늘 참석자를 체크해주세요.
              </p>
            ) : (
              <ul className="space-y-2">
                {players.map((p) => {
                  const stats = lifetimeStatsFor(p.id);
                  const tier = tierMap[p.id];
                  const badge = tierBadge[tier];
                  return (
                  <li
                    key={p.id}
                    className="bg-white rounded-xl px-4 py-3 flex items-center justify-between border border-stone-200"
                  >
                    <div>
                      <p className="text-sm font-medium flex items-center gap-1">
                        {p.name}
                        {badge && <span className={`text-xs ${badge.color}`}>{badge.emoji} {tier}</span>}
                      </p>
                      <p className="text-xs text-stone-400 scorefont">
                        오늘 {p.gamesPlayed}경기 · 통산 {stats.wins}승 {stats.losses}패
                      </p>
                    </div>
                    <button onClick={() => removePlayer(p.id)} className="text-red-500">✕</button>
                  </li>
                  );
                })}
              </ul>
            )}
          </div>

          <button
            disabled={!canGenerate}
            onClick={handleGenerate}
            className={`w-full rounded-2xl py-3.5 flex items-center justify-center gap-2 font-semibold headfont uppercase tracking-wide ${
              canGenerate ? "bg-[#4CAF50] text-white active:scale-[0.98]" : "bg-stone-200 text-stone-400"
            } transition`}
          >
            🔀 {roundNum > 0 ? "다음 라운드 매칭 생성" : "매칭 생성하기"} {!adminOn && "🔒"}
          </button>
          {!canGenerate && (
            <p className="text-xs text-center text-stone-400 -mt-2">최소 4명 이상 체크해야 매칭할 수 있어요.</p>
          )}
        </section>
      )}

      {tab === "checkin" && (
        <section className="px-5 mt-5 space-y-4">
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200">
            {!myId ? (
              <>
                <p className="text-sm font-semibold mb-1">로그인이 필요해요</p>
                <p className="text-xs text-stone-400 mb-3">홈페이지에서 이름으로 먼저 입장해주세요. (처음이면 자동 등록돼요)</p>
                <a
                  href="./index.html#login"
                  className="inline-block bg-[#4CAF50] text-white text-xs font-semibold rounded-full px-4 py-2"
                >
                  홈페이지에서 로그인하기
                </a>
              </>
            ) : (
              <div className="flex items-center justify-between">
                <p className="text-sm">
                  현재 <span className="font-bold text-[#4CAF50]">{(roster.find((m) => m.id === myId) || {}).name || "?"}</span> 님으로 로그인됨
                </p>
                <button onClick={resetIdentity} className="text-xs text-stone-400 underline underline-offset-2">
                  로그아웃
                </button>
              </div>
            )}
          </div>

          <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200">
            <div className="flex items-center justify-between mb-1">
              <p className="text-sm font-semibold">오늘 참석 체크인</p>
              {adminOn && (
                <button onClick={resetCheckins} className="text-[11px] text-red-500 underline underline-offset-2">
                  체크인 초기화
                </button>
              )}
            </div>
            <p className="text-xs text-stone-400 mb-3">본인 이름 버튼만 눌려요. 실시간으로 다 같이 봐요.</p>
            {!rosterReady ? (
              <p className="text-xs text-stone-400">불러오는 중...</p>
            ) : roster.length === 0 ? (
              <p className="text-xs text-stone-400">아직 등록된 멤버가 없어요. 참석자 탭에서 먼저 멤버를 등록해주세요.</p>
            ) : (
              <ul className="space-y-2">
                {roster.map((m) => {
                  const status = rsvp[m.id];
                  const isMe = m.id === myId;
                  return (
                    <li key={m.id} className="flex items-center justify-between border border-stone-200 rounded-xl px-3 py-2.5">
                      <span className={`text-sm font-medium ${isMe ? "" : "text-stone-400"}`}>{m.name}{isMe ? " (나)" : ""}</span>
                      <div className="flex gap-1.5">
                        <button
                          disabled={!isMe}
                          onClick={() => setMyRsvp(m.id, "in")}
                          className={`px-3 py-1 rounded-full text-xs border transition ${
                            status === "in" ? "bg-[#4CAF50] text-white border-[#4CAF50]" : "bg-stone-50 text-stone-500 border-stone-200"
                          } ${!isMe ? "opacity-40 cursor-not-allowed" : ""}`}
                        >
                          참석
                        </button>
                        <button
                          disabled={!isMe}
                          onClick={() => setMyRsvp(m.id, "out")}
                          className={`px-3 py-1 rounded-full text-xs border transition ${
                            status === "out" ? "bg-red-500 text-white border-red-500" : "bg-stone-50 text-stone-500 border-stone-200"
                          } ${!isMe ? "opacity-40 cursor-not-allowed" : ""}`}
                        >
                          불참
                        </button>
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
          {roster.length > 0 && (
            <p className="text-xs text-center text-stone-400">
              참석 {roster.filter((m) => rsvp[m.id] === "in").length}명 · 불참{" "}
              {roster.filter((m) => rsvp[m.id] === "out").length}명 · 무응답{" "}
              {roster.filter((m) => rsvp[m.id] !== "in" && rsvp[m.id] !== "out").length}명
            </p>
          )}
        </section>
      )}

      {tab === "match" && (
        <section className="px-5 mt-5 space-y-4">
          {!round ? (
            <div className="bg-white rounded-2xl p-5 text-center border border-dashed border-stone-300 space-y-3">
              <p className="text-sm text-stone-400">아직 생성된 매칭이 없어요.</p>
              <button
                disabled={!canGenerate}
                onClick={handleGenerate}
                className={`w-full rounded-2xl py-3.5 flex items-center justify-center gap-2 font-semibold headfont uppercase tracking-wide ${
                  canGenerate ? "bg-[#4CAF50] text-white active:scale-[0.98]" : "bg-stone-200 text-stone-400"
                } transition ${justShuffled ? "shuffle-pulse" : ""}`}
              >
                🔀 매칭 생성하기 {!adminOn && "🔒"}
              </button>
              {!canGenerate && <p className="text-xs text-stone-400">참석자 탭에서 4명 이상 등록해주세요.</p>}
            </div>
          ) : (
            <>
              {round.matches.map((m) => (
                <div key={m.id} className="rise-in bg-white rounded-2xl overflow-hidden border border-stone-200 shadow-sm">
                  <div className="bg-[#4CAF50] text-white/90 text-[11px] uppercase tracking-[0.2em] px-4 py-1.5 flex justify-between">
                    <span>Court {m.court}</span>
                    {m.done && <span className="text-[#FFD54F]">종료</span>}
                  </div>
                  <div className="grid grid-cols-[1fr_auto_1fr] items-center px-4 py-4 gap-2">
                    <div className="text-right">
                      <p className="text-sm font-medium leading-tight">{m.teamA[0].name}</p>
                      <p className="text-sm font-medium leading-tight">{m.teamA[1].name}</p>
                    </div>
                    <div className="flex flex-col items-center gap-1">
                      <div className="w-px h-4 bg-stone-300" />
                      <span className="text-[10px] text-stone-400">VS</span>
                      <div className="w-px h-4 bg-stone-300" />
                    </div>
                    <div>
                      <p className="text-sm font-medium leading-tight">{m.teamB[0].name}</p>
                      <p className="text-sm font-medium leading-tight">{m.teamB[1].name}</p>
                    </div>
                  </div>
                  <div className="flex items-center justify-center gap-3 pb-4">
                    <input
                      disabled={m.done}
                      value={m.scoreA}
                      onChange={(e) => updateScore(m.id, "scoreA", e.target.value)}
                      inputMode="numeric"
                      placeholder="0"
                      className="scorefont w-14 h-12 text-center text-xl rounded-xl border border-stone-300 bg-stone-50 disabled:bg-stone-100 disabled:text-stone-400"
                    />
                    <span className="text-stone-400">:</span>
                    <input
                      disabled={m.done}
                      value={m.scoreB}
                      onChange={(e) => updateScore(m.id, "scoreB", e.target.value)}
                      inputMode="numeric"
                      placeholder="0"
                      className="scorefont w-14 h-12 text-center text-xl rounded-xl border border-stone-300 bg-stone-50 disabled:bg-stone-100 disabled:text-stone-400"
                    />
                  </div>
                  {!m.done && (
                    <button
                      onClick={() => finishMatch(m.id)}
                      disabled={m.scoreA === "" || m.scoreB === "" || m.scoreA === m.scoreB}
                      className="w-full py-2.5 text-sm font-semibold bg-[#FFD54F] text-[#5c4a00] disabled:bg-stone-200 disabled:text-stone-400"
                    >
                      경기 종료
                    </button>
                  )}
                </div>
              ))}

              {round.resting.length > 0 && (
                <div className="bg-stone-100 rounded-2xl p-4 border border-stone-200">
                  <p className="text-xs uppercase tracking-widest text-stone-400 mb-1">쉬는 중</p>
                  <p className="text-sm">{round.resting.map((p) => p.name).join(", ")}</p>
                </div>
              )}

              <div className="bg-white rounded-2xl p-4 border border-stone-200">
                <p className="text-xs font-semibold text-stone-500 mb-1">다음 라운드는 쉴래요</p>
                <p className="text-xs text-stone-400 mb-2">본인 이름만 눌려요. 누르면 다음 매칭 생성할 때 자동으로 쉬는 사람에 들어가요. 아래 목록은 관리자를 포함해 모두에게 실시간으로 보여요.</p>
                {Object.keys(restWish).length > 0 && (
                  <p className="text-xs font-semibold mb-2" style={{ color: "#4CAF50" }}>
                    ✋ 쉬고 싶어하는 사람: {players.filter((p) => restWish[p.id]).map((p) => p.name).join(", ") || "-"}
                  </p>
                )}
                <div className="flex flex-wrap gap-2">
                  {players.map((p) => {
                    const wantsRest = !!restWish[p.id];
                    const isMe = p.id === myId;
                    return (
                      <button
                        key={p.id}
                        disabled={!isMe}
                        onClick={() => toggleRestWish(p.id)}
                        className={`px-3 py-1.5 rounded-full text-xs border transition ${
                          wantsRest ? "bg-stone-800 text-white border-stone-800" : "bg-stone-50 text-stone-500 border-stone-200"
                        } ${!isMe ? "opacity-40 cursor-not-allowed" : ""}`}
                      >
                        {p.name} {wantsRest ? "· 쉼" : ""}
                      </button>
                    );
                  })}
                </div>
              </div>

              {allDone && (
                <button
                  onClick={handleGenerate}
                  className="w-full rounded-2xl py-3.5 flex items-center justify-center gap-2 font-semibold headfont uppercase tracking-wide bg-[#4CAF50] text-white active:scale-[0.98] transition"
                >
                  🔀 다음 라운드 {!adminOn && "🔒"}
                </button>
              )}
            </>
          )}
        </section>
      )}

      {tab === "record" && (
        <section className="px-5 mt-5 space-y-5">
          <div>
            <p className="text-sm font-semibold mb-2">🏆 통산 순위</p>
            <p className="text-[11px] text-stone-400 mb-2">기록은 저장돼서 새로고침해도 사라지지 않아요.</p>
            <ul className="space-y-2">
              {[...players]
                .map((p) => ({ ...p, stats: lifetimeStatsFor(p.id) }))
                .sort((a, b) => b.stats.wins - a.stats.wins || b.stats.games - a.stats.games)
                .map((p, i) => (
                  <li key={p.id} className="bg-white rounded-xl px-4 py-3 flex items-center justify-between border border-stone-200">
                    <div className="flex items-center gap-3">
                      <span className="scorefont text-sm text-stone-400 w-4">{i + 1}</span>
                      <span className="text-sm font-medium">{p.name}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="scorefont text-sm text-stone-500">{p.stats.wins}승 {p.stats.losses}패</span>
                      {adminOn && (
                        <button onClick={() => correctPlayerStats(p)} className="text-[11px] text-stone-400 underline underline-offset-2">
                          수정
                        </button>
                      )}
                    </div>
                  </li>
                ))}
              {players.length === 0 && (
                <p className="text-sm text-stone-400 bg-white rounded-2xl p-5 text-center border border-dashed border-stone-300">
                  참석자를 먼저 등록해주세요.
                </p>
              )}
            </ul>
          </div>

          <div>
            <p className="text-sm font-semibold mb-2">📋 경기 기록</p>
            {history.length === 0 ? (
              <p className="text-sm text-stone-400 bg-white rounded-2xl p-5 text-center border border-dashed border-stone-300">
                아직 종료된 경기가 없어요.
              </p>
            ) : (
              <ul className="space-y-2">
                {history.map((m) => (
                  <li key={m.id} className="bg-white rounded-xl px-4 py-3 border border-stone-200 text-sm">
                    <p className="text-[11px] text-stone-400 mb-1">R{m.round} · Court {m.court}</p>
                    <div className="flex justify-between items-center">
                      <span>{m.teamA[0].name}·{m.teamA[1].name}</span>
                      <span className="scorefont font-semibold">{m.scoreA} : {m.scoreB}</span>
                      <span>{m.teamB[0].name}·{m.teamB[1].name}</span>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </section>
      )}

      <BottomNav active="match" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
