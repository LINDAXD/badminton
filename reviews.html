<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>후기 | Birdie</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./app.js"></script>
<script type="text/babel">

function ReviewCard({ r, canDelete, onRemove, onOpenPhoto }) {
  const likedKey = `bm_reviewliked_${r.id}`;
  const [liked, setLiked] = React.useState(() => localStorage.getItem(likedKey) === "1");
  const likeCount = (r.likes || []).length;
  const photos = photosOf(r);

  function toggleLike() {
    REFS.reviews.get().then((snap) => {
      const data = snap.data() || {};
      const items = data.items || [];
      const next = items.map((it) => {
        if (it.id !== r.id) return it;
        const likes = it.likes || [];
        return liked ? { ...it, likes: likes.slice(1) } : { ...it, likes: [...likes, uid()] };
      });
      REFS.reviews.set({ items: next }).catch(() => {});
    });
    if (liked) { localStorage.removeItem(likedKey); setLiked(false); }
    else { localStorage.setItem(likedKey, "1"); setLiked(true); }
  }

  return (
    <li className="rise-in bg-white rounded-2xl border border-stone-100 shadow-sm overflow-hidden">
      {photos.length > 0 && (
        <button onClick={() => onOpenPhoto(r, 0)} className="relative block w-full">
          <img src={photos[0]} alt="후기 사진" className="w-full max-h-80 object-cover" />
          {photos.length > 1 && (
            <span className="absolute bottom-2 right-2 bg-black/60 text-white text-[11px] px-2 py-0.5 rounded-full">
              📷 {photos.length}장
            </span>
          )}
          {photos.length >= 3 && (
            <span className="absolute top-2 left-2 text-white text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: "#4CAF50" }}>
              ✨ 인기 후기
            </span>
          )}
        </button>
      )}
      <div className="p-4">
        <div className="flex items-start justify-between gap-2">
          {r.text && <p className="text-sm text-stone-700 whitespace-pre-wrap flex-1">{r.text}</p>}
          {canDelete && (
            <button onClick={() => onRemove(r)} className="text-red-400 text-xs shrink-0">삭제</button>
          )}
        </div>
        <div className="flex items-center gap-3 mt-2">
          <button onClick={toggleLike} className="text-xs flex items-center gap-1 tap-scale" style={{ color: liked ? "#4CAF50" : "#A8A8A8" }}>
            {liked ? "💚" : "🤍"} {likeCount}
          </button>
          <span className="text-[11px] text-stone-400 ml-auto">{r.author || "익명"} · {r.date}</span>
        </div>
      </div>
    </li>
  );
}

function Lightbox({ r, startIndex, onClose, canDelete, onRemove }) {
  const photos = photosOf(r);
  const [idx, setIdx] = React.useState(startIndex || 0);
  const photo = photos[idx];
  return (
    <div
      className="fixed inset-0 bg-black/85 z-50 flex flex-col items-center justify-center p-4"
      onClick={onClose}
    >
      <div className="relative w-full flex items-center justify-center" onClick={(e) => e.stopPropagation()}>
        {photos.length > 1 && (
          <button onClick={() => setIdx((i) => (i - 1 + photos.length) % photos.length)} className="absolute left-1 text-white text-2xl px-2">‹</button>
        )}
        {photo && <img src={photo} alt="후기 사진" className="max-h-[70vh] max-w-full rounded-xl object-contain" />}
        {photos.length > 1 && (
          <button onClick={() => setIdx((i) => (i + 1) % photos.length)} className="absolute right-1 text-white text-2xl px-2">›</button>
        )}
      </div>
      {photos.length > 1 && <p className="text-white text-xs mt-2">{idx + 1} / {photos.length}</p>}
      <div className="bg-white rounded-2xl p-4 mt-3 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
        {r.text && <p className="text-sm text-stone-700 whitespace-pre-wrap mb-2">{r.text}</p>}
        <div className="flex items-center justify-between">
          <span className="text-[11px] text-stone-400">{r.author || "익명"} · {r.date}</span>
          {canDelete && (
            <button onClick={() => { onRemove(r); onClose(); }} className="text-red-400 text-xs">삭제</button>
          )}
        </div>
      </div>
      <button onClick={onClose} className="mt-3 text-white text-xs underline underline-offset-2">닫기</button>
    </div>
  );
}


function groupBy(items, keyFn) {
  const map = {};
  items.forEach((it) => {
    const k = keyFn(it);
    if (!map[k]) map[k] = [];
    map[k].push(it);
  });
  return map;
}

function App() {
  const { myId, myName } = useIdentity();
  const { roster } = useRoster();
  const { adminOn } = useAdmin(isOfficerOf(roster, myId));
  const [reviews, setReviews] = React.useState([]);
  const [ready, setReady] = React.useState(false);
  const [showForm, setShowForm] = React.useState(false);
  const [text, setText] = React.useState("");
  const [files, setFiles] = React.useState([]);
  const [uploading, setUploading] = React.useState(false);
  const [viewMode, setViewMode] = React.useState("feed");
  const [lightboxItem, setLightboxItem] = React.useState(null);
  const [lightboxIndex, setLightboxIndex] = React.useState(0);

  function openPhoto(r, idx) {
    setLightboxItem(r);
    setLightboxIndex(idx);
  }

  React.useEffect(() => {
    const unsub = REFS.reviews.onSnapshot((snap) => {
      const data = snap.data();
      setReviews(data && data.items ? data.items : []);
      setReady(true);
    }, () => setReady(true));
    return () => unsub();
  }, []);

  function openForm() {
    if (!myId) {
      appAlert("후기를 올리려면 먼저 홈에서 이름으로 입장해주세요.");
      window.location.href = "./index.html#login";
      return;
    }
    setShowForm((v) => !v);
  }

  async function addReview() {
    if (!text.trim() && files.length === 0) {
      appAlert("글이나 사진 중 하나는 넣어주세요.");
      return;
    }
    setUploading(true);
    let photoUrls = [];
    try {
      for (const f of files) {
        const url = await uploadToCloudinary(f);
        photoUrls.push(url);
      }
    } catch (e) {
      console.error(e);
      appAlert(`사진 업로드에 실패했어요. (${e.message || "알 수 없는 오류"})\n일부 사진만 등록될 수 있어요.`);
    }
    const item = {
      id: uid(),
      author: myName || "익명",
      authorId: myId,
      text: text.trim(),
      photoUrls,
      date: todayStr(),
      likes: [],
    };
    REFS.reviews.set({ items: [item, ...reviews] }).catch(() => {});
    setText(""); setFiles([]); setUploading(false); setShowForm(false);
  }

  async function removeReview(r) {
    if (!(await appConfirm("이 후기를 삭제할까요?"))) return;
    // Cloudinary는 브라우저에서 직접 삭제할 수 없어(서버 서명 필요), 목록에서만 제거해요.
    REFS.reviews.set({ items: reviews.filter((it) => it.id !== r.id) }).catch(() => {});
  }

  const photoReviews = reviews.filter((r) => photosOf(r).length > 0);
  const byDate = groupBy(reviews, (r) => r.date || "날짜 없음");
  const dateKeys = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
  const byAuthor = groupBy(reviews, (r) => r.author || "익명");
  const authorKeys = Object.keys(byAuthor).sort((a, b) => byAuthor[b].length - byAuthor[a].length || a.localeCompare(b));

  return (
    <div className="min-h-screen bg-white text-stone-800 font-sans pb-24">
      <TopHeader title="📸 후기" subtitle="함께한 순간을 자유롭게 남겨보세요" />

      <section className="px-5 max-w-2xl mx-auto mb-4 flex justify-end">
        <button onClick={openForm} className="text-[11px] px-3 py-1.5 rounded-full border tap-scale" style={{ borderColor: "#FFD54F", color: "#B98900" }}>
          {showForm ? "닫기" : "✏️ 후기 남기기"}
        </button>
      </section>

      {showForm && (
        <section className="px-5 max-w-2xl mx-auto mb-4">
          <div className="bg-white rounded-2xl p-4 border border-stone-200 space-y-2 shadow-sm">
            <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="오늘 모임 어땠나요? 자유롭게 남겨주세요." className="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm h-20" />
            <input type="file" accept="image/*" multiple onChange={(e) => setFiles([...e.target.files])} className="text-xs" />
            {files.length > 0 && <p className="text-[11px] text-stone-400">사진 {files.length}장 선택됨{files.length >= 3 ? " · ✨ 3장 이상이면 홈 화면에 자동으로 소개돼요!" : ""}</p>}
            <button onClick={addReview} disabled={uploading} className="w-full text-white rounded-lg py-2 text-sm font-semibold" style={{ backgroundColor: "#4CAF50" }}>
              {uploading ? "업로드 중..." : "후기 올리기"}
            </button>
          </div>
        </section>
      )}

      {/* view mode tabs */}
      <section className="px-5 max-w-2xl mx-auto mb-4">
        <div className="flex gap-1.5 bg-stone-50 rounded-2xl p-1.5 border border-stone-100">
          {[
            { key: "feed", label: "최신순", emoji: "🕒" },
            { key: "date", label: "날짜별", emoji: "📅" },
            { key: "photos", label: "사진모아보기", emoji: "🖼️" },
            { key: "author", label: "작성자별", emoji: "🙋" },
          ].map(({ key, label, emoji }) => (
            <button
              key={key}
              onClick={() => setViewMode(key)}
              className={`flex-1 py-2 rounded-xl text-[11px] font-semibold tap-scale flex items-center justify-center gap-1 transition ${
                viewMode === key ? "text-white shadow-sm" : "text-stone-400"
              }`}
              style={viewMode === key ? { backgroundColor: "#4CAF50" } : {}}
            >
              <span>{emoji}</span>{label}
            </button>
          ))}
        </div>
      </section>

      <section className="px-5 max-w-2xl mx-auto mb-8">
        {!ready ? (
          <div className="space-y-3"><Skeleton className="h-40 w-full" /><Skeleton className="h-40 w-full" /></div>
        ) : reviews.length === 0 ? (
          <p className="text-sm text-stone-400 bg-white rounded-2xl p-6 text-center border border-dashed border-stone-200">아직 후기가 없어요. 첫 후기를 남겨보세요!</p>
        ) : viewMode === "feed" ? (
          <ul className="space-y-3">
            {reviews.map((r) => (
              <ReviewCard key={r.id} r={r} canDelete={adminOn || r.authorId === myId} onRemove={removeReview} onOpenPhoto={openPhoto} />
            ))}
          </ul>
        ) : viewMode === "date" ? (
          <div className="space-y-5">
            {dateKeys.map((d) => (
              <div key={d}>
                <p className="text-xs font-bold text-stone-500 mb-2">📅 {fmtDate(d)} ({byDate[d].length})</p>
                <ul className="space-y-3">
                  {byDate[d].map((r) => (
                    <ReviewCard key={r.id} r={r} canDelete={adminOn || r.authorId === myId} onRemove={removeReview} onOpenPhoto={openPhoto} />
                  ))}
                </ul>
              </div>
            ))}
          </div>
        ) : viewMode === "author" ? (
          <div className="space-y-5">
            {authorKeys.map((a) => (
              <div key={a}>
                <p className="text-xs font-bold text-stone-500 mb-2">🙋 {a} ({byAuthor[a].length})</p>
                <ul className="space-y-3">
                  {byAuthor[a].map((r) => (
                    <ReviewCard key={r.id} r={r} canDelete={adminOn || r.authorId === myId} onRemove={removeReview} onOpenPhoto={openPhoto} />
                  ))}
                </ul>
              </div>
            ))}
          </div>
        ) : (
          // photos view: grid gallery, tap to open lightbox — 후기별 사진을 전부 낱장으로 펼쳐서 보여줘요
          photoReviews.length === 0 ? (
            <p className="text-sm text-stone-400 bg-white rounded-2xl p-6 text-center border border-dashed border-stone-200">아직 사진이 있는 후기가 없어요.</p>
          ) : (
            <div className="grid grid-cols-3 gap-1">
              {photoReviews.flatMap((r) =>
                photosOf(r).map((url, i) => (
                  <button key={r.id + "_" + i} onClick={() => openPhoto(r, i)} className="aspect-square overflow-hidden rounded-lg tap-scale">
                    <img src={url} alt="후기 사진" className="w-full h-full object-cover" />
                  </button>
                ))
              )}
            </div>
          )
        )}
      </section>

      {lightboxItem && (
        <Lightbox
          r={lightboxItem}
          startIndex={lightboxIndex}
          onClose={() => setLightboxItem(null)}
          canDelete={adminOn || lightboxItem.authorId === myId}
          onRemove={removeReview}
        />
      )}

      <BottomNav active="reviews" />
      <AppModalHost />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
