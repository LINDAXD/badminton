<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Birdie Club | 혼자보다 함께, 버디클럽</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="./firebase.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./app.js"></script>
<script type="text/babel">
const QUOTES = [
  "실수해도 괜찮아요, 오늘도 나가서 뛰는 게 승리예요.",
  "라켓을 처음 잡던 그날의 설렘을 기억하세요.",
  "혼자 치는 스매시보다, 함께 웃는 랠리가 더 오래 남아요.",
  "잘 치는 것보다 즐겁게 치는 게 먼저예요.",
  "오늘 흘린 땀이 다음 랠리를 더 즐겁게 만들어줘요.",
  "같이 뛰는 사람이 있다는 것, 그게 버디클럽이에요.",
];
function quoteOfToday() {
  const day = new Date().getDate();
  return QUOTES[day % QUOTES.length];
}

function App() {
  const { myId, myName, login, logout } = useIdentity();
  const { roster } = useRoster();
  const [loginInput, setLoginInput] = React.useState("");
  const [loginMsg, setLoginMsg] = React.useState("");
  const [rsvp, setRsvp] = React.useState({});
  const [notices, setNotices] = React.useState([]);
  const [noticesReady, setNoticesReady] = React.useState(false);
  const [schedule, setSchedule] = React.useState([]);
  const [checkedInMsg, setCheckedInMsg] = React.useState("");

  React.useEffect(() => {
    const unsub = REFS.checkin.onSnapshot((snap) => {
      const data = snap.data();
      setRsvp(data && data.data ? data.data : {});
    });
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.notices.onSnapshot((snap) => {
      const data = snap.data();
      setNotices(data && data.items ? data.items : []);
      setNoticesReady(true);
    }, () => setNoticesReady(true));
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.schedule.onSnapshot((snap) => {
      const data = snap.data();
      setSchedule(data && data.items ? data.items : []);
    });
    return () => unsub();
  }, []);

  function doLogin() {
    const name = loginInput.trim();
    if (!name) { setLoginMsg("이름을 입력해주세요."); return; }
    const existing = roster.find((m) => m.name === name);
    if (existing) {
      login(existing.id, existing.name);
    } else {
      const member = { id: uid(), name, grade: "신입회원", joinedAt: todayStr(), birthday: "" };
      const next = [...roster, member];
      REFS.roster.set({ members: next }).catch(() => {});
      login(member.id, member.name);
      setLoginMsg("새 멤버로 등록됐어요, 환영해요! 🌱");
    }
    setLoginInput("");
  }

  function checkInNow() {
    if (!myId) {
      document.getElementById("login")?.scrollIntoView({ behavior: "smooth" });
      setLoginMsg("먼저 이름으로 입장해주세요.");
      return;
    }
    const next = { ...rsvp, [myId]: "in" };
    setRsvp(next);
    REFS.checkin.set({ data: next }).catch(() => {});
    logAttendance(myId);
    setCheckedInMsg("참석 체크 완료! 오늘 만나요 🏸");
    setTimeout(() => setCheckedInMsg(""), 2500);
  }

  const attendCount = Object.values(rsvp).filter((v) => v === "in").length;
  const pinned = notices.find((n) => n.pinned);
  const preview = pinned || notices[0];
  const upcoming = [...schedule]
    .filter((s) => s.date >= todayStr())
    .sort((a, b) => a.date.localeCompare(b.date))[0];

  return (
    <div className="min-h-screen bg-white text-stone-800 font-sans pb-24">
      {/* top */}
      <header className="px-5 pt-7 pb-2 max-w-2xl mx-auto flex items-center justify-between">
        <span className="headfont text-lg" style={{ color: "#4CAF50" }}>🏸 Birdie Club</span>
        {myId ? (
          <button onClick={logout} className="text-xs bg-stone-50 border border-stone-200 text-stone-500 rounded-full px-3 py-1.5 font-medium">
            {myName}님 · 로그아웃
          </button>
        ) : (
          <a href="#login" className="text-xs bg-white border rounded-full px-3 py-1.5 font-medium" style={{ borderColor: "#4CAF50", color: "#4CAF50" }}>
            로그인
          </a>
        )}
      </header>

      {/* hero */}
      <section className="px-5 pt-4 pb-6 max-w-2xl mx-auto text-center">
        <div className="text-6xl mb-3 floaty">🏸</div>
        <h1 className="headfont text-3xl leading-snug text-stone-900">
          혼자보다 함께,<br />
          <span style={{ color: "#4CAF50" }}>버디클럽</span>
        </h1>
        <p className="text-stone-400 mt-2 text-sm">오늘도 같이 뛰어요, 우리 클럽 Birdie Club</p>

        <div className="flex gap-2 justify-center mt-6">
          <button onClick={checkInNow} className="tap-scale text-white text-sm font-bold px-6 py-3 rounded-full shadow-sm" style={{ backgroundColor: "#4CAF50" }}>
            ✋ 참석하기
          </button>
          <a href="./match.html" className="tap-scale text-sm font-bold px-6 py-3 rounded-full border" style={{ borderColor: "#FFD54F", color: "#B98900", backgroundColor: "#FFFBEA" }}>
            🎲 랜덤매칭
          </a>
        </div>
        {checkedInMsg && <p className="text-xs mt-2" style={{ color: "#4CAF50" }}>{checkedInMsg}</p>}
      </section>

      {/* login card */}
      <section id="login" className="px-5 max-w-2xl mx-auto mb-5">
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
          {myId ? (
            <div className="flex items-center justify-between">
              <p className="text-sm"><span className="font-bold" style={{ color: "#4CAF50" }}>{myName}</span>님으로 로그인됨</p>
              <button onClick={logout} className="text-xs text-stone-400 underline underline-offset-2">로그아웃</button>
            </div>
          ) : (
            <>
              <p className="text-sm font-semibold text-stone-800 mb-1">이름으로 입장하기</p>
              <p className="text-xs text-stone-400 mb-3">기존 멤버는 이름 그대로, 처음이면 자동으로 등록돼요.</p>
              <div className="flex gap-2">
                <input
                  value={loginInput}
                  onChange={(e) => { setLoginInput(e.target.value); if (loginMsg) setLoginMsg(""); }}
                  onKeyDown={(e) => e.key === "Enter" && doLogin()}
                  placeholder="이름 입력"
                  className="flex-1 rounded-xl border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2"
                  style={{ "--tw-ring-color": "#4CAF50" }}
                />
                <button onClick={doLogin} className="text-white rounded-xl px-4 text-sm font-semibold tap-scale" style={{ backgroundColor: "#4CAF50" }}>입장</button>
              </div>
              {loginMsg && <p className="text-xs mt-1.5" style={{ color: "#4CAF50" }}>{loginMsg}</p>}
            </>
          )}
        </div>
      </section>

      {/* quick cards */}
      <section className="px-5 max-w-2xl mx-auto grid grid-cols-2 gap-3 mb-4">
        <div className="rise-in bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
          <p className="text-[11px] text-stone-400 mb-1">오늘 참석 인원</p>
          <p className="headfont text-2xl" style={{ color: "#4CAF50" }}>{attendCount}<span className="text-sm text-stone-400 font-normal">명</span></p>
        </div>
        <div className="rise-in bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
          <p className="text-[11px] text-stone-400 mb-1">다음 모임</p>
          {upcoming ? (
            <>
              <p className="text-sm font-bold text-stone-800">{fmtDate(upcoming.date)}</p>
              <p className="text-[11px] text-stone-400 truncate">{upcoming.title}</p>
            </>
          ) : (
            <p className="text-sm text-stone-400">일정 준비 중</p>
          )}
        </div>
      </section>

      <section className="px-5 max-w-2xl mx-auto mb-4">
        <a href="./notices.html" className="rise-in block bg-white rounded-2xl p-4 shadow-sm border border-stone-100 tap-scale">
          <div className="flex items-center justify-between mb-1">
            <p className="text-[11px] text-stone-400">📢 공지사항</p>
            <span className="text-[11px] text-stone-300">더보기 &gt;</span>
          </div>
          {!noticesReady ? (
            <Skeleton className="h-5 w-2/3" />
          ) : preview ? (
            <p className="text-sm font-bold text-stone-800 truncate">
              {preview.pinned && <span className="mr-1" style={{ color: "#FFD54F" }}>📌</span>}
              {preview.title}
            </p>
          ) : (
            <p className="text-sm text-stone-400">아직 등록된 공지가 없어요.</p>
          )}
        </a>
      </section>

      <section className="px-5 max-w-2xl mx-auto mb-8">
        <div className="rise-in rounded-2xl p-4 text-center" style={{ backgroundColor: "#FFFBEA", border: "1px solid #FFD54F" }}>
          <p className="text-[11px] font-bold mb-1" style={{ color: "#B98900" }}>💬 오늘의 한마디</p>
          <p className="text-sm text-stone-700 leading-relaxed">{quoteOfToday()}</p>
        </div>
      </section>

      <BottomNav active="home" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
