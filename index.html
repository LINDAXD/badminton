<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Birdie | 혼자보다 함께, 버디</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./app.js"></script>
<script type="text/babel">
const QUOTES = [
  "실수해도 괜찮아요, 오늘도 나가서 뛰는 게 승리예요.",
  "라켓을 처음 잡던 그날의 설렘을 기억하세요.",
  "혼자 치는 스매시보다, 함께 웃는 랠리가 더 오래 남아요.",
  "잘 치는 것보다 즐겁게 치는 게 먼저예요.",
  "오늘 흘린 땀이 다음 랠리를 더 즐겁게 만들어줘요.",
  "같이 뛰는 사람이 있다는 것, 그게 버디이에요.",
];
function quoteOfToday() {
  const day = new Date().getDate();
  return QUOTES[day % QUOTES.length];
}

function MyBirthdayField({ me, onSave }) {
  const [val, setVal] = React.useState((me && me.birthday) || "");
  const [msg, setMsg] = React.useState("");
  React.useEffect(() => {
    setVal((me && me.birthday) || "");
  }, [me && me.id]);

  function save() {
    const digits = val.replace(/\D/g, "").slice(0, 4);
    if (digits.length !== 4) { setMsg("숫자 4자리로 입력해주세요 (예: 0805)"); return; }
    const mm = parseInt(digits.slice(0, 2), 10);
    const dd = parseInt(digits.slice(2, 4), 10);
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) { setMsg("월/일을 다시 확인해주세요."); return; }
    onSave(digits);
    setVal(digits);
    setMsg("생일이 등록됐어요! 🎂");
    setTimeout(() => setMsg(""), 2500);
  }

  return (
    <div>
      <div className="flex items-center gap-2 flex-wrap">
        <span className="text-[11px] text-stone-400 shrink-0">🎂 내 생일</span>
        <input
          type="tel"
          inputMode="numeric"
          value={val}
          onChange={(e) => { setVal(e.target.value.replace(/\D/g, "").slice(0, 4)); if (msg) setMsg(""); }}
          placeholder="0805"
          className="text-xs border border-stone-200 rounded-lg px-2 py-1.5 w-16 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
        <button onClick={save} className="text-[11px] text-white rounded-lg px-3 py-1.5 shrink-0" style={{ backgroundColor: "#4CAF50" }}>
          저장
        </button>
        {me && me.birthday && !msg && (
          <span className="text-[11px] text-stone-400">현재 {fmtBirthday(me.birthday)}로 등록됨</span>
        )}
      </div>
      {msg && <p className="text-[11px] mt-1" style={{ color: msg.includes("등록됐") ? "#4CAF50" : "#dc2626" }}>{msg}</p>}
    </div>
  );
}

function App() {
  const { myId, myName, login, logout } = useIdentity();
  const { roster } = useRoster();
  const [loginInput, setLoginInput] = React.useState("");
  const [signupLevel, setSignupLevel] = React.useState("초보");
  const [loginMsg, setLoginMsg] = React.useState("");
  const [rsvp, setRsvp] = React.useState({});
  const [notices, setNotices] = React.useState([]);
  const [noticesReady, setNoticesReady] = React.useState(false);
  const [schedule, setSchedule] = React.useState([]);
  const [reviews, setReviews] = React.useState([]);
  const [reviewsReady, setReviewsReady] = React.useState(false);
  const [checkedInMsg, setCheckedInMsg] = React.useState("");
  const [paymentInfo, setPaymentInfo] = React.useState(null);
  const [payments, setPayments] = React.useState({});
  const [pending, setPending] = React.useState([]);
  const [checkinlog, setCheckinlog] = React.useState([]);

  React.useEffect(() => {
    const unsub = REFS.pending.onSnapshot((snap) => {
      const data = snap.data();
      setPending(data && data.items ? data.items : []);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.checkinlog.onSnapshot((snap) => {
      const data = snap.data();
      setCheckinlog(data && data.items ? data.items : []);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.paymentinfo.onSnapshot((snap) => {
      const data = snap.data();
      setPaymentInfo(data && data.bank ? data : null);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.payments.onSnapshot((snap) => {
      const data = snap.data();
      const all = data && data.data ? data.data : {};
      setPayments(all[todayStr()] || {});
    }, () => {});
    return () => unsub();
  }, []);

  function togglePaid() {
    if (!myId) return;
    const paidNow = !payments[myId];
    const next = { ...payments, [myId]: paidNow ? { paid: true, at: new Date().toISOString() } : undefined };
    if (!paidNow) delete next[myId];
    setPayments(next);
    REFS.payments.get().then((snap) => {
      const data = snap.data() || {};
      const all = data.data || {};
      all[todayStr()] = next;
      REFS.payments.set({ data: all }).catch(() => {});
    }).catch(() => {});
  }


  React.useEffect(() => {
    const unsub = REFS.checkin.onSnapshot((snap) => {
      const data = snap.data();
      setRsvp(data && data.data ? data.data : {});
    });
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.notices.onSnapshot((snap) => {
      const data = snap.data();
      setNotices(data && data.items ? data.items : []);
      setNoticesReady(true);
    }, () => setNoticesReady(true));
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.schedule.onSnapshot((snap) => {
      const data = snap.data();
      setSchedule(data && data.items ? data.items : []);
    });
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.reviews.onSnapshot((snap) => {
      const data = snap.data();
      setReviews(data && data.items ? data.items : []);
      setReviewsReady(true);
    }, () => setReviewsReady(true));
    return () => unsub();
  }, []);

  function doLogin() {
    const name = loginInput.trim();
    if (!name) { setLoginMsg("이름을 입력해주세요."); return; }
    const existing = roster.find((m) => m.name === name);
    if (existing) {
      if (existing.pin) {
        const pin = window.prompt(`${name}님, 본인 확인을 위해 비밀번호(숫자 4자리)를 입력해주세요.`);
        if (pin === null) return;
        if (pin !== existing.pin) {
          setLoginMsg("비밀번호가 일치하지 않아요. 본인이 아니라면 입장할 수 없어요.");
          return;
        }
        login(existing.id, existing.name);
      } else {
        const pin = window.prompt(`${name}님, 처음이시네요! 앞으로 본인 확인에 쓸 비밀번호를 설정해주세요.\n(반드시 숫자 4자리로만 입력해주세요. 예: 0524)`);
        if (pin === null) return;
        if (!/^\d{4}$/.test(pin)) { setLoginMsg("비밀번호는 숫자 4자리로만 설정할 수 있어요. 더 길거나 짧으면 안 돼요."); return; }
        const next = roster.map((m) => (m.id === existing.id ? { ...m, pin } : m));
        REFS.roster.set({ members: next }).catch(() => {});
        login(existing.id, existing.name);
        setLoginMsg("비밀번호가 설정됐어요. 다음부턴 이 비밀번호로 입장해주세요.");
      }
    } else {
      const alreadyPending = pending.some((p) => p.name === name);
      if (alreadyPending) {
        setLoginMsg("이미 관리자 승인을 기다리고 있는 이름이에요. 승인되면 로그인할 수 있어요.");
        setLoginInput("");
        return;
      }
      const pin = window.prompt(`${name}님, 처음 오셨네요! 앞으로 본인 확인에 쓸 비밀번호를 설정해주세요.\n(반드시 숫자 4자리로만 입력해주세요. 예: 0524)`);
      if (pin === null) return;
      if (!/^\d{4}$/.test(pin)) { setLoginMsg("비밀번호는 숫자 4자리로만 설정할 수 있어요. 더 길거나 짧으면 안 돼요."); return; }
      const req = { id: uid(), name, pin, level: signupLevel, requestedAt: todayStr() };
      REFS.pending.set({ items: [...pending, req] }).catch(() => {});
      setLoginMsg("가입 신청됐어요! 관리자 승인 후 이 이름과 비밀번호로 로그인할 수 있어요. 🙏");
    }
    setLoginInput("");
  }

  const me = roster.find((m) => m.id === myId);

  function updateMyBirthday(birthday) {
    const next = roster.map((m) => (m.id === myId ? { ...m, birthday } : m));
    REFS.roster.set({ members: next }).catch(() => {});
  }

  function updateMyLevel(level) {
    const next = roster.map((m) => (m.id === myId ? { ...m, level } : m));
    REFS.roster.set({ members: next }).catch(() => {});
  }

  function changeMyPin() {
    if (!me) return;
    const current = window.prompt("현재 비밀번호를 입력해주세요.");
    if (current === null) return;
    if (current !== (me.pin || "")) {
      window.alert("현재 비밀번호가 일치하지 않아요.");
      return;
    }
    const next1 = window.prompt("새 비밀번호를 입력해주세요.\n(반드시 숫자 4자리로만 입력해주세요. 예: 0524)");
    if (next1 === null) return;
    if (!/^\d{4}$/.test(next1)) { window.alert("비밀번호는 숫자 4자리로만 설정할 수 있어요. 더 길거나 짧으면 안 돼요."); return; }
    const next = roster.map((m) => (m.id === myId ? { ...m, pin: next1 } : m));
    REFS.roster.set({ members: next }).catch(() => {});
    window.alert("비밀번호가 변경됐어요.");
  }

  function checkInNow() {
    if (!myId) {
      document.getElementById("login")?.scrollIntoView({ behavior: "smooth" });
      setLoginMsg("먼저 이름으로 입장해주세요.");
      return;
    }
    const next = { ...rsvp, [myId]: "in" };
    setRsvp(next);
    REFS.checkin.set({ data: next }).catch(() => {});
    logAttendance(myId);
    setCheckedInMsg("참석 체크 완료! 오늘 만나요 🏸");
    setTimeout(() => setCheckedInMsg(""), 2500);
  }

  function cancelCheckIn() {
    if (!myId) return;
    const next = { ...rsvp, [myId]: "out" };
    setRsvp(next);
    REFS.checkin.set({ data: next }).catch(() => {});
    setCheckedInMsg("참석이 취소됐어요.");
    setTimeout(() => setCheckedInMsg(""), 2500);
  }

  const attendCount = Object.values(rsvp).filter((v) => v === "in").length;
  const attendingMembers = roster.filter((m) => rsvp[m.id] === "in");
  const latestPhoto = reviews.find((r) => photosOf(r).length >= 3);
  function isFirstTimer(id) {
    return checkinlog.filter((c) => c.memberId === id).length <= 1;
  }
  const pinned = notices.find((n) => n.pinned);
  const preview = pinned || notices[0];
  const upcomingList = [...schedule]
    .filter((s) => s.date >= todayStr())
    .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")))
    .slice(0, 3);
  const birthdayMembers = roster.filter((m) => m.birthday && m.birthday === todayMD());
  const newMembersToday = roster.filter((m) => m.joinedAt === todayStr());

  return (
    <div className="min-h-screen bg-white text-stone-800 font-sans pb-24">
      {/* top */}
      <header className="px-5 pt-7 pb-2 max-w-2xl mx-auto flex items-center justify-between">
        <span className="headfont text-lg" style={{ color: "#4CAF50" }}>🏸 Birdie</span>
        {myId ? (
          <button onClick={logout} className="text-xs bg-stone-50 border border-stone-200 text-stone-500 rounded-full px-3 py-1.5 font-medium">
            {myName}님 · 로그아웃
          </button>
        ) : (
          <a href="#login" className="text-xs bg-white border rounded-full px-3 py-1.5 font-medium" style={{ borderColor: "#4CAF50", color: "#4CAF50" }}>
            로그인
          </a>
        )}
      </header>

      {/* birthday banner */}
      {birthdayMembers.length > 0 && (
        <section className="px-5 pt-3 max-w-2xl mx-auto">
          <div className="rise-in rounded-2xl p-3.5 text-center" style={{ backgroundColor: "#FFFBEA", border: "1px solid #FFD54F" }}>
            <p className="text-sm font-bold" style={{ color: "#B98900" }}>
              🎂 오늘은 <span>{birthdayMembers.map((m) => m.name).join(", ")}</span>님의 생일이에요!
            </p>
          </div>
        </section>
      )}

      {/* 신규 회원 환영 배너 */}
      {newMembersToday.length > 0 && (
        <section className="px-5 pt-3 max-w-2xl mx-auto">
          <div className="rise-in rounded-2xl p-3.5 text-center" style={{ backgroundColor: "#F0FBF1", border: "1px solid #4CAF50" }}>
            <p className="text-sm font-bold" style={{ color: "#2e7d32" }}>
              🎉 <span>{newMembersToday.map((m) => m.name).join(", ")}</span>님, 버디에 오신 걸 환영해요!
            </p>
          </div>
        </section>
      )}

      {/* hero */}
      <section className="px-5 pt-4 pb-6 max-w-2xl mx-auto text-center">
        {latestPhoto ? (
          <div className="relative rounded-3xl overflow-hidden mb-4 rise-in" style={{ height: "180px" }}>
            <img src={photosOf(latestPhoto)[0]} alt="최근 모임 사진" className="w-full h-full object-cover" />
            <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent" />
            <div className="absolute bottom-0 left-0 right-0 p-4 text-left">
              <h1 className="headfont text-2xl text-white leading-snug">
                혼자보다 함께, <span style={{ color: "#FFD54F" }}>버디</span>
              </h1>
            </div>
          </div>
        ) : (
          <>
            <div className="text-6xl mb-3 floaty">🏸</div>
            <h1 className="headfont text-3xl leading-snug text-stone-900">
              혼자보다 함께,<br />
              <span style={{ color: "#4CAF50" }}>버디</span>
            </h1>
          </>
        )}
        <p className="text-stone-400 mt-2 text-sm">오늘도 같이 뛰어요, 우리 버디</p>

        <div className="flex gap-2 justify-center mt-6">
          {rsvp[myId] === "in" ? (
            <button onClick={cancelCheckIn} className="tap-scale text-sm font-bold px-7 py-4 rounded-full shadow-sm border-2" style={{ borderColor: "#4CAF50", color: "#4CAF50", backgroundColor: "white" }}>
              ✅ 참석취소
            </button>
          ) : (
            <button onClick={checkInNow} className="tap-scale text-white text-base font-bold px-8 py-4 rounded-full shadow-sm" style={{ backgroundColor: "#4CAF50" }}>
              ✋ 참석하기
            </button>
          )}
          <a href="./match.html" className="tap-scale text-sm font-bold px-6 py-4 rounded-full border" style={{ borderColor: "#FFD54F", color: "#B98900", backgroundColor: "#FFFBEA" }}>
            🎲 랜덤매칭
          </a>
        </div>
        {checkedInMsg && <p className="text-xs mt-2" style={{ color: "#4CAF50" }}>{checkedInMsg}</p>}
      </section>

      {/* venue rental fee (대관비) */}
      {myId && paymentInfo && rsvp[myId] === "in" && (
        <section className="px-5 max-w-2xl mx-auto mb-5">
          <div className="rise-in bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
            <p className="text-sm font-bold text-stone-800 mb-1">💰 오늘 대관비</p>
            <p className="text-xs text-stone-400 mb-3">아래 계좌로 송금 후 완료 버튼을 눌러주세요.</p>
            <div className="bg-stone-50 rounded-xl p-3 mb-3 space-y-1">
              <p className="text-sm"><span className="text-stone-400">은행</span> · <b>{paymentInfo.bank}</b></p>
              <p className="text-sm"><span className="text-stone-400">계좌번호</span> · <b className="scorefont">{paymentInfo.account}</b></p>
              <p className="text-sm"><span className="text-stone-400">예금주</span> · <b>{paymentInfo.holder}</b></p>
              <p className="text-sm"><span className="text-stone-400">금액</span> · <b style={{ color: "#4CAF50" }}>{fmtMoney(paymentInfo.amount)}</b></p>
            </div>
            <button
              onClick={togglePaid}
              className={`w-full rounded-xl py-2.5 text-sm font-semibold tap-scale ${payments[myId] ? "text-white" : "border"}`}
              style={payments[myId] ? { backgroundColor: "#4CAF50" } : { borderColor: "#4CAF50", color: "#4CAF50" }}
            >
              {payments[myId] ? "✅ 송금완료" : "송금완료 눌러주세요"}
            </button>
          </div>
        </section>
      )}

      {/* login card */}
      <section id="login" className="px-5 max-w-2xl mx-auto mb-5">
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
          {myId ? (
            <div>
              <div className="flex items-center justify-between">
                <p className="text-sm"><span className="font-bold" style={{ color: "#4CAF50" }}>{myName}</span>님으로 로그인됨</p>
                <button onClick={logout} className="text-xs text-stone-400 underline underline-offset-2">로그아웃</button>
              </div>
              <div className="mt-3 pt-3 border-t border-stone-100 space-y-2">
                <MyBirthdayField me={me} onSave={updateMyBirthday} />
                <div className="flex items-center gap-2">
                  <span className="text-[11px] text-stone-400 shrink-0">🏸 내 레벨</span>
                  <select
                    value={(me && me.level) || "초보"}
                    onChange={(e) => updateMyLevel(e.target.value)}
                    className="text-xs border border-stone-200 rounded-lg px-2 py-1.5"
                  >
                    {window.LEVELS.map((lv) => (
                      <option key={lv} value={lv}>{lv}</option>
                    ))}
                  </select>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={changeMyPin} className="text-[11px] text-stone-400 underline underline-offset-2">
                    🔑 비밀번호 변경
                  </button>
                  <a href="./myinfo.html" className="text-[11px] text-stone-400 underline underline-offset-2">
                    🙋 내 정보 보기
                  </a>
                </div>
              </div>
            </div>
          ) : (
            <>
              <p className="text-sm font-semibold text-stone-800 mb-1">이름으로 입장하기</p>
              <p className="text-xs text-stone-400 mb-3">기존 멤버는 이름 그대로, 처음이면 가입 신청 후 관리자 승인을 받아요.</p>
              <div className="flex gap-2">
                <input
                  value={loginInput}
                  onChange={(e) => { setLoginInput(e.target.value); if (loginMsg) setLoginMsg(""); }}
                  onKeyDown={(e) => e.key === "Enter" && doLogin()}
                  placeholder="이름 입력"
                  className="flex-1 rounded-xl border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2"
                  style={{ "--tw-ring-color": "#4CAF50" }}
                />
                <button onClick={doLogin} className="text-white rounded-xl px-4 text-sm font-semibold tap-scale" style={{ backgroundColor: "#4CAF50" }}>입장</button>
              </div>
              <div className="flex items-center gap-2 mt-2">
                <span className="text-[11px] text-stone-400 shrink-0">처음이면 내 실력</span>
                <select
                  value={signupLevel}
                  onChange={(e) => setSignupLevel(e.target.value)}
                  className="text-xs border border-stone-200 rounded-lg px-2 py-1.5"
                >
                  {window.LEVELS.map((lv) => (
                    <option key={lv} value={lv}>{lv}</option>
                  ))}
                </select>
              </div>
              {loginMsg && <p className="text-xs mt-1.5" style={{ color: "#4CAF50" }}>{loginMsg}</p>}
              <p className="text-[10px] text-stone-300 mt-2">🔒 다른 사람의 이름으로는 비밀번호 없이 입장할 수 없어요.</p>
            </>
          )}
        </div>
      </section>

      {/* upcoming schedule */}
      <section className="px-5 max-w-2xl mx-auto mb-3">
        <div className="rise-in bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
          <p className="text-[11px] text-stone-400 mb-2">🗓️ 다가오는 모임</p>
          {upcomingList.length === 0 ? (
            <p className="text-sm text-stone-400">예정된 일정이 없어요.</p>
          ) : (
            <>
              <div className="mb-3 pb-3 border-b border-stone-100">
                <p className="headfont text-2xl text-stone-900">
                  {fmtDate(upcomingList[0].date)}
                  {upcomingList[0].time && <span className="ml-2 text-lg" style={{ color: "#4CAF50" }}>{fmtTime(upcomingList[0].time)}</span>}
                </p>
                <p className="text-sm text-stone-600 mt-0.5">{upcomingList[0].title}{upcomingList[0].location ? ` · ${upcomingList[0].location}` : ""}</p>
              </div>
              {upcomingList.length > 1 && (
                <ul className="space-y-2">
                  {upcomingList.slice(1).map((s) => (
                    <li key={s.id} className="flex items-center justify-between gap-2">
                      <p className="text-sm font-medium text-stone-600 truncate">{s.title}</p>
                      <p className="text-[11px] text-stone-400 shrink-0">
                        {fmtDate(s.date)}{s.time ? ` · ${fmtTime(s.time)}` : ""}
                      </p>
                    </li>
                  ))}
                </ul>
              )}
            </>
          )}
        </div>
      </section>

      {/* quick cards */}
      <section className="px-5 max-w-2xl mx-auto mb-4">
        <div className="rise-in bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
          <div className="flex items-center justify-between mb-2">
            <p className="text-[11px] text-stone-400">오늘 참석 인원</p>
            <p className="headfont text-xl" style={{ color: "#4CAF50" }}>{attendCount}<span className="text-xs text-stone-400 font-normal">명</span></p>
          </div>
          {attendingMembers.length === 0 ? (
            <p className="text-xs text-stone-400">아직 참석한 사람이 없어요.</p>
          ) : (
            <div className="flex flex-wrap gap-1.5">
              {attendingMembers.map((m) => (
                <span key={m.id} className="text-xs bg-stone-50 border border-stone-200 rounded-full px-2.5 py-1 text-stone-600">
                  {isFirstTimer(m.id) && <span className="mr-0.5">🌱</span>}
                  {m.name}
                </span>
              ))}
            </div>
          )}
        </div>
      </section>

      <section className="px-5 max-w-2xl mx-auto mb-4">
        <a href="./reviews.html" className="rise-in block bg-white rounded-2xl p-4 shadow-sm border border-stone-100 tap-scale overflow-hidden">
          <p className="text-[11px] text-stone-400 mb-1">📸 최근 후기</p>
          {!reviewsReady ? (
            <Skeleton className="h-5 w-2/3" />
          ) : reviews[0] ? (
            <p className="text-sm font-bold text-stone-800 truncate">{reviews[0].text || "사진 후기"}</p>
          ) : (
            <p className="text-sm text-stone-400">아직 후기가 없어요.</p>
          )}
        </a>
      </section>

      <section className="px-5 max-w-2xl mx-auto mb-4">
        <a href="./notices.html" className="rise-in block bg-white rounded-2xl p-4 shadow-sm border border-stone-100 tap-scale">
          <div className="flex items-center justify-between mb-1">
            <p className="text-[11px] text-stone-400">📢 공지사항</p>
            <span className="text-[11px] text-stone-300">더보기 &gt;</span>
          </div>
          {!noticesReady ? (
            <Skeleton className="h-5 w-2/3" />
          ) : preview ? (
            <p className="text-sm font-bold text-stone-800 truncate">
              {preview.pinned && <span className="mr-1" style={{ color: "#FFD54F" }}>📌</span>}
              {preview.title}
            </p>
          ) : (
            <p className="text-sm text-stone-400">아직 등록된 공지가 없어요.</p>
          )}
        </a>
      </section>

      <section className="px-5 max-w-2xl mx-auto mb-8">
        <div className="rise-in rounded-2xl p-4 text-center" style={{ backgroundColor: "#FFFBEA", border: "1px solid #FFD54F" }}>
          <p className="text-[11px] font-bold mb-1" style={{ color: "#B98900" }}>💬 오늘의 한마디</p>
          <p className="text-sm text-stone-700 leading-relaxed">{quoteOfToday()}</p>
        </div>
      </section>

      <BottomNav active="home" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
