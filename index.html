<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>왕초보 배드민턴 모임 | 2030 안산</title>
<link rel="icon" href="data:," />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase (same project as the matching app, new "notices" doc) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDn5tgqFHAKNbiSBwxyrxyhKgFR9w1jf8E",
    authDomain: "badminton-42968.firebaseapp.com",
    projectId: "badminton-42968",
    storageBucket: "badminton-42968.firebasestorage.app",
    messagingSenderId: "1079190230967",
    appId: "1:1079190230967:web:82c8c22b7f84fa5ea23a32"
  };
  firebase.initializeApp(firebaseConfig);
  window.db = firebase.firestore();
</script>

<style>
  body { margin: 0; }
  .headfont { font-family: 'Arial Black', 'Helvetica Neue', sans-serif; letter-spacing: -0.01em; }
  @keyframes floaty { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
  .floaty { animation: floaty 3.2s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const db = window.db;
const NOTICE_REF = db.collection("badminton").doc("notices");
const uid = () => Math.random().toString(36).slice(2, 9);

function App() {
  const [notices, setNotices] = useState([]);
  const [noticesReady, setNoticesReady] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");

  useEffect(() => {
    const unsub = NOTICE_REF.onSnapshot((snap) => {
      const data = snap.data();
      setNotices(data && data.items ? data.items : []);
      setNoticesReady(true);
    }, () => setNoticesReady(true));
    return () => unsub();
  }, []);

  function addNotice() {
    if (!title.trim()) return;
    const item = {
      id: uid(),
      title: title.trim(),
      body: body.trim(),
      date: new Date().toISOString().slice(0, 10),
    };
    const next = [item, ...notices];
    setNotices(next);
    NOTICE_REF.set({ items: next }).catch(() => {});
    setTitle("");
    setBody("");
  }

  function removeNotice(id) {
    const next = notices.filter((n) => n.id !== id);
    setNotices(next);
    NOTICE_REF.set({ items: next }).catch(() => {});
  }

  return (
    <div className="min-h-screen bg-[#FFF9F2] text-stone-800 font-sans">

      {/* nav */}
      <nav className="flex items-center justify-between px-5 py-4 max-w-2xl mx-auto">
        <span className="headfont text-lg text-teal-700">🏸 셔틀런</span>
        <a
          href="./match.html"
          className="text-xs bg-white border border-teal-200 text-teal-700 rounded-full px-3 py-1.5 font-medium"
        >
          매칭 앱 바로가기
        </a>
      </nav>

      {/* hero */}
      <section className="px-5 pt-6 pb-10 max-w-2xl mx-auto text-center">
        <div className="text-6xl mb-4 floaty">🏸</div>
        <p className="inline-block bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full mb-3">
          왕초보 환영 · 텃세 없음
        </p>
        <h1 className="headfont text-3xl leading-snug text-stone-900">
          2030 배드민턴 모임<br />
          <span className="text-teal-600">셔틀런</span>
        </h1>
        <p className="text-stone-500 mt-3 text-sm leading-relaxed">
          라켓 처음 잡아봐도 괜찮아요.<br />
          같이 웃고, 같이 뛰고, 같이 늘어요.
        </p>
        <div className="flex gap-2 justify-center mt-6">
          <a
            href="#join"
            className="bg-teal-600 text-white text-sm font-bold px-6 py-3 rounded-full shadow-sm shadow-teal-200 active:scale-95 transition"
          >
            가입 신청하기
          </a>
          <a
            href="#info"
            className="bg-white text-teal-700 text-sm font-bold px-6 py-3 rounded-full border border-teal-200 active:scale-95 transition"
          >
            모임 정보 보기
          </a>
        </div>
      </section>

      {/* intro cards */}
      <section className="px-5 max-w-2xl mx-auto grid grid-cols-3 gap-3 mb-10">
        {[
          { emoji: "🐣", title: "왕초보 환영", desc: "라켓 처음도 OK" },
          { emoji: "🤝", title: "텃세 없어요", desc: "다 같이 배워요" },
          { emoji: "😄", title: "즐기는 게 목표", desc: "승부보다 재미" },
        ].map((c) => (
          <div key={c.title} className="bg-white rounded-2xl p-4 text-center shadow-sm border border-stone-100">
            <div className="text-2xl mb-1">{c.emoji}</div>
            <p className="text-xs font-bold text-stone-800">{c.title}</p>
            <p className="text-[11px] text-stone-400 mt-0.5">{c.desc}</p>
          </div>
        ))}
      </section>

      {/* operations info */}
      <section id="info" className="px-5 max-w-2xl mx-auto mb-10">
        <h2 className="headfont text-lg text-stone-900 mb-3">📋 운영 안내</h2>
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-stone-100 space-y-4">
          <div className="flex gap-3">
            <span className="text-xl">📍</span>
            <div>
              <p className="text-xs text-stone-400">장소</p>
              <p className="text-sm font-semibold text-stone-800">안산 중앙공원 배드민턴장</p>
            </div>
          </div>
          <div className="flex gap-3">
            <span className="text-xl">🎂</span>
            <div>
              <p className="text-xs text-stone-400">연령대</p>
              <p className="text-sm font-semibold text-stone-800">20~30대</p>
            </div>
          </div>
          <div className="flex gap-3">
            <span className="text-xl">🗓️</span>
            <div>
              <p className="text-xs text-stone-400">정기 모임</p>
              <p className="text-sm font-semibold text-stone-800">매주 정기 모임 진행 (일정은 공지 참고)</p>
            </div>
          </div>
          <div className="flex gap-3">
            <span className="text-xl">🙋</span>
            <div>
              <p className="text-xs text-stone-400">참여 방식</p>
              <p className="text-sm font-semibold text-stone-800">가입 신청 후 운영진 승인 → 밴드/체크인으로 참석 안내</p>
            </div>
          </div>
        </div>
      </section>

      {/* gear checklist */}
      <section className="px-5 max-w-2xl mx-auto mb-10">
        <h2 className="headfont text-lg text-stone-900 mb-3">🎒 준비물</h2>
        <div className="grid grid-cols-3 gap-3">
          {[
            { emoji: "🏸", label: "배드민턴 라켓" },
            { emoji: "👟", label: "실내 배드민턴화" },
            { emoji: "🪶", label: "셔틀콕" },
          ].map((g) => (
            <div key={g.label} className="bg-teal-50 rounded-2xl p-4 text-center border border-teal-100">
              <div className="text-2xl mb-1">{g.emoji}</div>
              <p className="text-xs font-semibold text-teal-800">{g.label}</p>
            </div>
          ))}
        </div>
        <p className="text-[11px] text-stone-400 text-center mt-2">라켓이 없어도 처음 몇 번은 대여 가능해요 🙌</p>
      </section>

      {/* notice board */}
      <section className="px-5 max-w-2xl mx-auto mb-10">
        <div className="flex items-center justify-between mb-3">
          <h2 className="headfont text-lg text-stone-900">📣 공지사항</h2>
          <button
            onClick={() => setShowAdmin((v) => !v)}
            className="text-[11px] text-stone-400 underline underline-offset-2"
          >
            {showAdmin ? "닫기" : "운영진 글쓰기"}
          </button>
        </div>

        {showAdmin && (
          <div className="bg-white rounded-2xl p-4 mb-3 border border-stone-200 space-y-2">
            <input
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              placeholder="공지 제목 (예: 이번주 셔틀콕 안내)"
              className="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm"
            />
            <textarea
              value={body}
              onChange={(e) => setBody(e.target.value)}
              placeholder="내용 (선택)"
              className="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm h-20"
            />
            <button
              onClick={addNotice}
              className="w-full bg-teal-600 text-white rounded-lg py-2 text-sm font-semibold"
            >
              공지 올리기
            </button>
          </div>
        )}

        {!noticesReady ? (
          <p className="text-xs text-stone-400 text-center py-4">불러오는 중...</p>
        ) : notices.length === 0 ? (
          <p className="text-sm text-stone-400 bg-white rounded-2xl p-6 text-center border border-dashed border-stone-200">
            아직 등록된 공지가 없어요.
          </p>
        ) : (
          <ul className="space-y-2">
            {notices.map((n) => (
              <li key={n.id} className="bg-white rounded-xl p-4 border border-stone-100 shadow-sm">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <p className="text-sm font-bold text-stone-800">{n.title}</p>
                    {n.body && <p className="text-xs text-stone-500 mt-1 whitespace-pre-wrap">{n.body}</p>}
                  </div>
                  {showAdmin && (
                    <button onClick={() => removeNotice(n.id)} className="text-red-400 text-xs shrink-0">삭제</button>
                  )}
                </div>
                <p className="text-[10px] text-stone-300 mt-2">{n.date}</p>
              </li>
            ))}
          </ul>
        )}
      </section>

      {/* join CTA footer */}
      <section id="join" className="px-5 max-w-2xl mx-auto pb-16">
        <div className="bg-teal-600 rounded-3xl p-7 text-center text-white">
          <p className="text-xl headfont mb-1">같이 배워요 🏸</p>
          <p className="text-sm text-teal-50 mb-5">처음이라도 괜찮아요, 편하게 놀러 오세요</p>
          <a
            href="https://open.kakao.com/"
            target="_blank"
            rel="noreferrer"
            className="inline-block bg-white text-teal-700 font-bold text-sm px-8 py-3 rounded-full active:scale-95 transition"
          >
            카톡 오픈채팅으로 문의하기
          </a>
          <p className="text-[11px] text-teal-100 mt-3">* 링크는 운영진이 실제 오픈채팅 주소로 교체해주세요</p>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
