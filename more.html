<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>더보기 | Birdie</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./style.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./app.js"></script>
<script type="text/babel">

function AccordionSection({ title, emoji, defaultOpen, children }) {
  const [open, setOpen] = React.useState(!!defaultOpen);
  return (
    <section className="px-5 max-w-2xl mx-auto mb-4">
      <button
        onClick={() => setOpen((v) => !v)}
        className="w-full flex items-center justify-between bg-white rounded-2xl p-4 border border-stone-100 shadow-sm tap-scale"
      >
        <span className="text-sm font-bold text-stone-800">{emoji} {title}</span>
        <span className="text-stone-300 text-xs">{open ? "접기 ▲" : "펼치기 ▼"}</span>
      </button>
      {open && <div className="mt-3 space-y-4 rise-in">{children}</div>}
    </section>
  );
}

function App() {
  const { myId, myName } = useIdentity();
  const { roster } = useRoster();
  const { adminOn, tryUnlock, lock } = useAdmin(isOfficerOf(roster, myId));
  const [rsvp, setRsvp] = React.useState({});
  const [checkinlog, setCheckinlog] = React.useState([]);
  const [suggestions, setSuggestions] = React.useState([]);
  const [sReady, setSReady] = React.useState(false);
  const [schedule, setSchedule] = React.useState([]);
  const [suggestText, setSuggestText] = React.useState("");
  const [suggestMsg, setSuggestMsg] = React.useState("");
  const [replyDrafts, setReplyDrafts] = React.useState({});
  const [schedTitle, setSchedTitle] = React.useState("");
  const [schedDate, setSchedDate] = React.useState("");
  const [schedTime, setSchedTime] = React.useState("");
  const [schedLoc, setSchedLoc] = React.useState("");
  const [schedCapacity, setSchedCapacity] = React.useState("");
  const [showRanking, setShowRanking] = React.useState(false);
  const [paymentInfo, setPaymentInfo] = React.useState(null);
  const [payments, setPayments] = React.useState({});
  const [pfBank, setPfBank] = React.useState("");
  const [pfAccount, setPfAccount] = React.useState("");
  const [pfHolder, setPfHolder] = React.useState("");
  const [pfAmount, setPfAmount] = React.useState("");

  React.useEffect(() => {
    const u1 = REFS.checkin.onSnapshot((s) => { const d = s.data(); setRsvp(d && d.data ? d.data : {}); });
    const u2 = REFS.checkinlog.onSnapshot((s) => { const d = s.data(); setCheckinlog(d && d.items ? d.items : []); });
    const u3 = REFS.suggestions.onSnapshot((s) => { const d = s.data(); setSuggestions(d && d.items ? d.items : []); setSReady(true); }, () => setSReady(true));
    const u4 = REFS.schedule.onSnapshot((s) => { const d = s.data(); setSchedule(d && d.items ? d.items : []); });
    const u5 = REFS.paymentinfo.onSnapshot((s) => {
      const d = s.data();
      setPaymentInfo(d && d.bank ? d : null);
      if (d) { setPfBank(d.bank || ""); setPfAccount(d.account || ""); setPfHolder(d.holder || ""); setPfAmount(d.amount || ""); }
    }, () => {});
    const u6 = REFS.payments.onSnapshot((s) => {
      const d = s.data();
      const all = d && d.data ? d.data : {};
      setPayments(all[todayStr()] || {});
    }, () => {});
    return () => { u1(); u2(); u3(); u4(); u5(); u6(); };
  }, []);

  function savePaymentInfo() {
    if (!pfBank.trim() || !pfAccount.trim() || !pfHolder.trim() || !pfAmount) {
      appAlert("은행, 계좌번호, 예금주, 금액을 모두 입력해주세요.");
      return;
    }
    REFS.paymentinfo.set({ bank: pfBank.trim(), account: pfAccount.trim(), holder: pfHolder.trim(), amount: Number(pfAmount) }).catch(() => {});
    appAlert("대관비 계좌 정보가 저장됐어요.");
  }

  function toggleMemberPaid(memberId) {
    const paidNow = !payments[memberId];
    const next = { ...payments, [memberId]: paidNow ? { paid: true, at: new Date().toISOString() } : undefined };
    if (!paidNow) delete next[memberId];
    setPayments(next);
    REFS.payments.get().then((snap) => {
      const data = snap.data() || {};
      const all = data.data || {};
      all[todayStr()] = next;
      REFS.payments.set({ data: all }).catch(() => {});
    }).catch(() => {});
  }

  // 출석왕: checkinlog 기준 누적 출석 최다 회원
  const attendanceCounts = {};
  checkinlog.forEach((it) => { attendanceCounts[it.memberId] = (attendanceCounts[it.memberId] || 0) + 1; });
  const kingId = Object.keys(attendanceCounts).sort((a, b) => attendanceCounts[b] - attendanceCounts[a])[0];
  const king = roster.find((m) => m.id === kingId);

  // 오늘의 버디: 오늘 참석(in) 체크한 사람 중 날짜 시드로 1명 랜덤 선정 (모두에게 동일)
  const todayAttendeesRaw = todayScheduleAttendees(getEffectiveAttendanceEvents(schedule));
  const todayAttendees = todayAttendeesRaw.map((a) => roster.find((m) => m.id === a.id) || a);
  const seed = new Date().getDate();
  const buddy = todayAttendees.length ? todayAttendees[seed % todayAttendees.length] : null;

  // 생일회원
  const birthdayMembers = roster.filter((m) => m.birthday && m.birthday === todayMD());

  function submitSuggestion() {
    const text = suggestText.trim();
    if (!text) return;
    const item = { id: uid(), text, date: todayStr(), reply: "", answered: false };
    REFS.suggestions.set({ items: [item, ...suggestions] }).catch(() => {});
    setSuggestText("");
    setSuggestMsg("건의사항이 익명으로 전달됐어요. 감사해요! 🙏");
    setTimeout(() => setSuggestMsg(""), 3000);
  }

  function submitReply(id) {
    const reply = (replyDrafts[id] || "").trim();
    if (!reply) return;
    REFS.suggestions.set({
      items: suggestions.map((s) => s.id === id ? { ...s, reply, answered: true } : s),
    }).catch(() => {});
  }

  async function removeSuggestion(id) {
    if (!(await appConfirm("이 건의사항을 삭제할까요?"))) return;
    REFS.suggestions.set({ items: suggestions.filter((s) => s.id !== id) }).catch(() => {});
  }

  function addSchedule() {
    if (!schedTitle.trim() || !schedDate) { appAlert("일정 제목과 날짜를 입력해주세요."); return; }
    const item = {
      id: uid(), title: schedTitle.trim(), date: schedDate, time: schedTime, location: schedLoc.trim(),
      capacity: schedCapacity ? Number(schedCapacity) : null,
      rsvp: [],
    };
    REFS.schedule.set({ items: [...schedule, item] }).catch(() => {});
    setSchedTitle(""); setSchedDate(""); setSchedTime(""); setSchedLoc(""); setSchedCapacity("");
  }

  function removeSchedule(id) {
    REFS.schedule.set({ items: schedule.filter((s) => s.id !== id) }).catch(() => {});
  }

  function setRsvpFor(item, status) {
    if (!myId) {
      appAlert("참석 체크를 하려면 먼저 홈에서 이름으로 입장해주세요.");
      window.location.href = "./index.html#login";
      return;
    }
    const list = item.rsvp || [];
    const existing = list.find((r) => r.id === myId);
    const at = existing ? existing.at : Date.now();
    const next = [...list.filter((r) => r.id !== myId), { id: myId, name: myName || "?", status, at }];
    REFS.schedule.set({
      items: schedule.map((s) => (s.id === item.id ? { ...s, rsvp: next } : s)),
    }).catch(() => {});
    // 오늘 일정에 ✅참석을 누르면 오늘 참석 체크(매칭 대상)도 자동으로 같이 돼요
    if (item.date === todayStr()) {
      const wasIn = rsvp[myId] === "in";
      if (status === "in" && !wasIn) {
        const nextRsvp = { ...rsvp, [myId]: "in" };
        setRsvp(nextRsvp);
        REFS.checkin.set({ data: nextRsvp }).catch(() => {});
        REFS.checkinlog.get().then((snap) => {
          const data = snap.data() || {};
          const items = data.items || [];
          const already = items.some((it) => it.memberId === myId && it.date === todayStr());
          if (!already) REFS.checkinlog.set({ items: [...items, { id: uid(), memberId: myId, date: todayStr() }] }).catch(() => {});
        }).catch(() => {});
      } else if (status !== "in" && wasIn) {
        // 참석이었다가 취소(미정/불참)로 바꾸면 참석 체크도 같이 풀리고, 노쇼 1회로 자동 기록돼요
        const nextRsvp = { ...rsvp, [myId]: "out" };
        setRsvp(nextRsvp);
        REFS.checkin.set({ data: nextRsvp }).catch(() => {});
        REFS.noshows.get().then((snap) => {
          const data = snap.data() || {};
          const items = data.items || [];
          REFS.noshows.set({ items: [...items, { id: uid(), memberId: myId, date: todayStr(), source: "auto" }] }).catch(() => {});
        }).catch(() => {});
        appAlert("참석을 취소하셨어요. 노쇼 1회로 자동 기록돼요.");
      }
    }
  }

  return (
    <RequireLogin myId={myId}>
    <div className="min-h-screen bg-white text-stone-800 font-sans pb-24">
      <TopHeader title="☰ 더보기" subtitle="버디의 다양한 기능들이에요" />

      {/* 🗓️ 일정 */}
      <AccordionSection title="일정" emoji="🗓️" defaultOpen={true}>
        <div className="grid grid-cols-2 gap-3">
          <div className="rise-in bg-white rounded-2xl p-4 border border-stone-100 shadow-sm">
            <p className="text-[11px] text-stone-400 mb-1">🥇 출석왕</p>
            <p className="text-sm font-bold text-stone-800">{king ? king.name : "집계 전"}</p>
            {king && <p className="text-[11px] text-stone-400">누적 {attendanceCounts[kingId]}회 참석</p>}
          </div>
          <div className="rise-in bg-white rounded-2xl p-4 border border-stone-100 shadow-sm">
            <p className="text-[11px] text-stone-400 mb-1">🎯 오늘의 버디</p>
            <p className="text-sm font-bold text-stone-800">{buddy ? buddy.name : "오늘 참석자 없음"}</p>
          </div>
        </div>

        {birthdayMembers.length > 0 && (
          <div className="rise-in rounded-2xl p-4" style={{ backgroundColor: "#FFFBEA", border: "1px solid #FFD54F" }}>
            <p className="text-[11px] font-bold mb-1" style={{ color: "#B98900" }}>🎂 오늘의 생일 회원</p>
            <p className="text-sm text-stone-700">{birthdayMembers.map((m) => m.name).join(", ")}님, 생일 축하해요!</p>
          </div>
        )}

        <div>
          <button onClick={() => setShowRanking((v) => !v)} className="flex items-center justify-between w-full mb-2">
            <p className="text-sm font-bold text-stone-700">🏅 출석 랭킹</p>
            <span className="text-xs text-stone-400">{showRanking ? "접기 ▲" : "전체 보기 ▼"}</span>
          </button>
          {showRanking && (
            Object.keys(attendanceCounts).length === 0 ? (
              <p className="text-xs text-stone-400 bg-white rounded-2xl p-4 text-center border border-dashed border-stone-200">아직 출석 기록이 없어요.</p>
            ) : (
              <ul className="space-y-2">
                {Object.keys(attendanceCounts)
                  .sort((a, b) => attendanceCounts[b] - attendanceCounts[a])
                  .slice(0, 10)
                  .map((id, i) => {
                    const m = roster.find((x) => x.id === id);
                    if (!m) return null;
                    return (
                      <li key={id} className="bg-white rounded-xl px-4 py-2.5 border border-stone-200 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <span className="scorefont text-sm text-stone-400 w-4">{i + 1}</span>
                          <span className="text-sm font-medium text-stone-800">{m.name}</span>
                        </div>
                        <span className="text-xs text-stone-500 scorefont">{attendanceCounts[id]}회</span>
                      </li>
                    );
                  })}
              </ul>
            )
          )}
        </div>

        <div>
          <p className="text-sm font-bold text-stone-700 mb-2">일정 목록</p>
          {schedule.length === 0 ? (
            <p className="text-xs text-stone-400 bg-white rounded-2xl p-4 text-center border border-dashed border-stone-200">등록된 일정이 없어요.</p>
          ) : (
            <ul className="space-y-2 mb-2">
              {[...schedule].sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""))).map((s) => {
                const rsvpList = s.rsvp || [];
                const myStatus = myId ? (rsvpList.find((r) => r.id === myId) || {}).status : null;
                const inList = rsvpList.filter((r) => r.status === "in").sort((a, b) => a.at - b.at);
                const maybeList = rsvpList.filter((r) => r.status === "maybe");
                const capacity = s.capacity;
                const confirmed = capacity ? inList.slice(0, capacity) : inList;
                const waitlist = capacity ? inList.slice(capacity) : [];
                const isFull = capacity && confirmed.length >= capacity;
                return (
                  <li key={s.id} className="bg-white rounded-xl px-4 py-3 border border-stone-200">
                    <div className="flex items-center justify-between gap-2">
                      <div className="min-w-0">
                        <p className="text-sm font-semibold text-stone-800 truncate">{s.title}</p>
                        <p className="text-[11px] text-stone-400">
                          {fmtDate(s.date)}{s.time ? ` · ${fmtTime(s.time)}` : ""}{s.location ? ` · ${s.location}` : ""}
                        </p>
                      </div>
                      {adminOn && <button onClick={() => removeSchedule(s.id)} className="text-red-400 text-xs shrink-0">삭제</button>}
                    </div>

                    <div className="flex items-center gap-2 mt-2 flex-wrap">
                      <span className="text-[11px] text-stone-500">
                        👥 {confirmed.length}{capacity ? ` / ${capacity}명` : "명"}
                        {isFull && <span className="ml-1 font-semibold" style={{ color: "#B98900" }}>정원 마감</span>}
                      </span>
                      {waitlist.length > 0 && <span className="text-[11px] text-stone-400">· 대기 {waitlist.length}명</span>}
                    </div>

                    {confirmed.length > 0 && (
                      <p className="text-[11px] text-stone-400 mt-1">참석: {confirmed.map((a) => a.name).join(", ")}</p>
                    )}
                    {waitlist.length > 0 && (
                      <p className="text-[11px] text-stone-400 mt-0.5">대기자: {waitlist.map((a) => a.name).join(", ")}</p>
                    )}
                    {maybeList.length > 0 && (
                      <p className="text-[11px] text-stone-400 mt-0.5">미정: {maybeList.map((a) => a.name).join(", ")}</p>
                    )}

                    <div className="flex gap-1.5 mt-2.5">
                      <button
                        onClick={() => setRsvpFor(s, "in")}
                        className={`flex-1 text-xs font-semibold py-1.5 rounded-lg border tap-scale ${myStatus === "in" ? "text-white border-transparent" : "text-stone-400 border-stone-200"}`}
                        style={myStatus === "in" ? { backgroundColor: "#4CAF50" } : {}}
                      >
                        ✅ 참석
                      </button>
                      <button
                        onClick={() => setRsvpFor(s, "maybe")}
                        className={`flex-1 text-xs font-semibold py-1.5 rounded-lg border tap-scale ${myStatus === "maybe" ? "text-white border-transparent" : "text-stone-400 border-stone-200"}`}
                        style={myStatus === "maybe" ? { backgroundColor: "#FFD54F", color: "#5c4a00" } : {}}
                      >
                        ❓ 미정
                      </button>
                      <button
                        onClick={() => setRsvpFor(s, "out")}
                        className={`flex-1 text-xs font-semibold py-1.5 rounded-lg border tap-scale ${myStatus === "out" ? "text-white border-transparent" : "text-stone-400 border-stone-200"}`}
                        style={myStatus === "out" ? { backgroundColor: "#dc2626" } : {}}
                      >
                        ❌ 불참
                      </button>
                    </div>
                  </li>
                );
              })}
            </ul>
          )}
          {myId && (
            <div className="bg-white rounded-2xl p-4 border border-stone-200 space-y-2">
              <p className="text-sm font-semibold text-stone-700">➕ 새 모임 만들기</p>
              <input value={schedTitle} onChange={(e) => setSchedTitle(e.target.value)} placeholder="일정 제목" className="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm" />
              <div className="flex gap-2">
                <input type="date" value={schedDate} onChange={(e) => setSchedDate(e.target.value)} className="flex-1 rounded-lg border border-stone-300 px-3 py-2 text-sm" />
                <input type="time" value={schedTime} onChange={(e) => setSchedTime(e.target.value)} className="flex-1 rounded-lg border border-stone-300 px-3 py-2 text-sm" />
              </div>
              <input value={schedLoc} onChange={(e) => setSchedLoc(e.target.value)} placeholder="장소(선택)" className="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm" />
              <div className="flex items-center gap-2">
                <span className="text-xs text-stone-400 shrink-0">정원(선택)</span>
                <select value={schedCapacity} onChange={(e) => setSchedCapacity(e.target.value)} className="flex-1 rounded-lg border border-stone-300 px-3 py-2 text-sm">
                  <option value="">제한 없음</option>
                  {Array.from({ length: 40 }, (_, i) => i + 1).map((n) => (
                    <option key={n} value={n}>{n}명</option>
                  ))}
                </select>
              </div>
              <p className="text-[11px] text-stone-400">정원을 채우면 그 다음 신청자는 자동으로 대기자로 표시돼요. 만든 모임은 관리자가 삭제할 수 있어요.</p>
              <button onClick={addSchedule} className="w-full text-white rounded-lg py-2 text-sm font-semibold" style={{ backgroundColor: "#4CAF50" }}>일정 추가</button>
            </div>
          )}
        </div>
      </AccordionSection>

      {/* 🏸 우리 클럽 정보 */}
      <AccordionSection title="우리 클럽 정보" emoji="🏸">
        <div className="grid grid-cols-3 gap-2">
          <a href="./myinfo.html" className="tap-scale bg-white rounded-xl p-3 border border-stone-100 shadow-sm">
            <p className="text-sm font-bold text-stone-800">🙋 나의 활동</p>
            <p className="text-[10px] text-stone-400 mt-0.5">후기·기록·일정</p>
          </a>
          <a href="./stats.html" className="tap-scale bg-white rounded-xl p-3 border border-stone-100 shadow-sm">
            <p className="text-sm font-bold text-stone-800">📊 통계</p>
            <p className="text-[10px] text-stone-400 mt-0.5">순위·명예의 전당</p>
          </a>
          <a href="./vote.html" className="tap-scale bg-white rounded-xl p-3 border border-stone-100 shadow-sm">
            <p className="text-sm font-bold text-stone-800">🗳️ 투표</p>
            <p className="text-[10px] text-stone-400 mt-0.5">MVP·친절왕 등</p>
          </a>
        </div>

        <div>
          <p className="text-sm font-bold text-stone-700 mb-2">📮 건의사항 (익명)</p>
          <div className="bg-white rounded-2xl p-4 border border-stone-200 mb-3">
            <textarea
              value={suggestText}
              onChange={(e) => setSuggestText(e.target.value)}
              placeholder="운영진에게 익명으로 건의하고 싶은 내용을 적어주세요."
              className="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm h-20"
            />
            <button onClick={submitSuggestion} className="mt-2 w-full text-white rounded-lg py-2 text-sm font-semibold" style={{ backgroundColor: "#4CAF50" }}>
              익명으로 보내기
            </button>
            {suggestMsg && <p className="text-xs mt-1.5" style={{ color: "#4CAF50" }}>{suggestMsg}</p>}
          </div>

          {!sReady ? (
            <Skeleton className="h-16 w-full" />
          ) : suggestions.length === 0 ? (
            <p className="text-xs text-stone-400 text-center py-2">아직 등록된 건의사항이 없어요.</p>
          ) : (
            <ul className="space-y-2">
              {suggestions.map((s) => (
                <li key={s.id} className="bg-white rounded-xl px-4 py-3 border border-stone-200">
                  <div className="flex items-start justify-between gap-2">
                    <p className="text-sm text-stone-700 whitespace-pre-wrap">{s.text}</p>
                    <span className={`shrink-0 text-[10px] font-bold px-2 py-0.5 rounded-full ${s.answered ? "bg-green-100 text-green-700" : "bg-stone-100 text-stone-400"}`}>
                      {s.answered ? "답변완료" : "대기중"}
                    </span>
                  </div>
                  <div className="flex items-center justify-between mt-1">
                    <p className="text-[10px] text-stone-300">{s.date}</p>
                    {adminOn && (
                      <button onClick={() => removeSuggestion(s.id)} className="text-red-400 text-[11px]">삭제</button>
                    )}
                  </div>
                  {s.reply && (
                    <div className="mt-2 bg-stone-50 rounded-lg px-3 py-2">
                      <p className="text-[11px] font-bold text-stone-500 mb-0.5">운영진 답변</p>
                      <p className="text-xs text-stone-600 whitespace-pre-wrap">{s.reply}</p>
                    </div>
                  )}
                  {adminOn && !s.answered && (
                    <div className="mt-2 flex gap-2">
                      <input
                        value={replyDrafts[s.id] || ""}
                        onChange={(e) => setReplyDrafts({ ...replyDrafts, [s.id]: e.target.value })}
                        placeholder="답변 작성"
                        className="flex-1 rounded-lg border border-stone-200 px-2.5 py-1.5 text-xs"
                      />
                      <button onClick={() => submitReply(s.id)} className="text-white text-xs px-3 rounded-lg" style={{ backgroundColor: "#4CAF50" }}>등록</button>
                    </div>
                  )}
                </li>
              ))}
            </ul>
          )}
        </div>
      </AccordionSection>

      {/* 🛠️ 관리자 전용 */}
      <AccordionSection title="관리자 전용" emoji="🛠️">
        <div className="flex items-center justify-end -mt-1">
          <button
            onClick={adminOn ? lock : () => tryUnlock()}
            className={`text-[11px] px-3 py-1.5 rounded-full border ${adminOn ? "text-white border-transparent" : "text-stone-400 border-stone-200"}`}
            style={adminOn ? { backgroundColor: "#4CAF50" } : {}}
          >
            {adminOn ? "🔓 관리자" : "🔒 관리자"}
          </button>
        </div>
        {adminOn ? (
          <>
            <div className="grid grid-cols-2 gap-3">
              <a href="./members.html" className="tap-scale bg-white rounded-xl p-3 text-center border border-stone-200 text-xs font-semibold text-stone-600">👥 회원 삭제/수정</a>
              <a href="./notices.html" className="tap-scale bg-white rounded-xl p-3 text-center border border-stone-200 text-xs font-semibold text-stone-600">📢 공지 작성 / 사진 삭제</a>
            </div>
            {(() => {
              const thisMonth = todayStr().slice(0, 7);
              const attendedThisMonth = new Set(checkinlog.filter((c) => c.date.slice(0, 7) === thisMonth).map((c) => c.memberId));
              const needsAttention = roster.filter((m) => {
                if (attendedThisMonth.has(m.id)) return false;
                if (m.joinedAt && m.joinedAt.slice(0, 7) === thisMonth) {
                  const daysSinceJoin = Math.floor((new Date() - new Date(m.joinedAt)) / 86400000);
                  if (daysSinceJoin < 20) return false;
                }
                return true;
              });
              if (needsAttention.length === 0) return null;
              return (
                <div>
                  <p className="text-sm font-bold text-stone-700 mb-2">⚠️ 이번 달 아직 참석 안 한 회원</p>
                  <p className="text-[11px] text-stone-400 mb-2">가입일부터, 또는 매달 최소 1회는 참석하는 게 원칙이에요.</p>
                  <div className="bg-white rounded-2xl p-4 border border-stone-200">
                    <div className="flex flex-wrap gap-1.5">
                      {needsAttention.map((m) => (
                        <span key={m.id} className="text-xs bg-red-50 border border-red-200 text-red-500 rounded-full px-2.5 py-1">{m.name}</span>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })()}
          </>
        ) : (
          <p className="text-xs text-stone-400 bg-white rounded-2xl p-4 text-center border border-dashed border-stone-200">관리자 인증 후 이용 가능해요.</p>
        )}
      </AccordionSection>

      <BottomNav active="more" />
      <AppModalHost />
    </div>
    </RequireLogin>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
